name: MonIA Intro Worker

on:
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even if the server manifest is complete
        required: false
        default: "false"
  push:
    branches: ["main"]
    paths:
      - "scripts/monia_intro_worker.py"
      - ".github/workflows/monia-intro-worker.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: monia-intro-generation
  cancel-in-progress: false

jobs:
  generate-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MONIA_FORCE: ${{ github.event_name == 'push' && 'true' || github.event.inputs.force || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install MonIA worker dependencies
        run: python -m pip install --disable-pip-version-check gradio_client pillow requests

      - name: Prepare Marion canonical source atlas locally
        shell: bash
        run: |
          mkdir -p public/resources/monia
          ffmpeg -hide_banner -loglevel error -y -ss 0.6 -i public/resources/marion-nimes.mp4 -frames:v 1 /tmp/marion-canon.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Image.open('/tmp/marion-canon.png').convert('RGB')
          canvas_w, canvas_h = 1600, 1200
          side, top, bottom, gap = 0.012, 0.13, 0.025, 0.008
          cell_w = (1 - side * 2 - gap * 3) / 4
          cell_h = (1 - top - bottom - gap * 2) / 3
          cw = round(cell_w * canvas_w)
          ch = round(cell_h * canvas_h)

          target_ratio = cw / ch
          source_ratio = source.width / source.height
          if source_ratio > target_ratio:
              new_w = round(source.height * target_ratio)
              left = max(0, (source.width - new_w) // 2)
              source = source.crop((left, 0, left + new_w, source.height))
          elif source_ratio < target_ratio:
              new_h = round(source.width / target_ratio)
              top_crop = max(0, (source.height - new_h) // 2)
              source = source.crop((0, top_crop, source.width, top_crop + new_h))
          source = source.resize((cw, ch), Image.Resampling.LANCZOS)

          canvas = Image.new('RGB', (canvas_w, canvas_h), 'black')
          for row in range(3):
              for col in range(4):
                  x = round((side + col * (cell_w + gap)) * canvas_w)
                  y = round((top + row * (cell_h + gap)) * canvas_h)
                  canvas.paste(source, (x, y))

          target = Path('public/resources/monia/atlas-marion.webp')
          canvas.save(target, 'WEBP', quality=92, method=6)
          print(f'Prepared local Marion atlas from canonical video: {target} ({target.stat().st_size} bytes)')
          PY

      - name: Keep Wan as a fast fallback probe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/monia_intro_worker.py')
          text = path.read_text(encoding='utf-8')
          old = 'WAN_TIMEOUT_SECONDS = 420'
          new = 'WAN_TIMEOUT_SECONDS = 20'
          if old not in text:
              raise SystemExit('Expected Wan timeout setting not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Wan probe timeout reduced to 20s; LTX remains the proven fallback.')
          PY

      - name: Validate MonIA worker syntax
        run: python -m py_compile scripts/monia_intro_worker.py

      - name: Generate true-video intro and persist to Infomaniak
        run: python scripts/monia_intro_worker.py

      - name: Verify generated videos are publicly reachable
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.parse import urljoin
          import requests

          site = 'https://marion-lucas.marionbolomey.fr'
          manifest_url = f'{site}/resources/monia/generated/intro-manifest.json?run=${{ github.run_id }}'
          last_error = None

          def video_signature_ok(data: bytes) -> bool:
              return b'ftyp' in data[:32] or data.startswith(b'\x1aE\xdf\xa3') or data.startswith(b'RIFF')

          for attempt in range(1, 7):
              try:
                  manifest_response = requests.get(
                      manifest_url,
                      timeout=20,
                      headers={'Cache-Control': 'no-cache', 'Pragma': 'no-cache'},
                  )
                  manifest_response.raise_for_status()
                  manifest = manifest_response.json()
                  shots = manifest.get('shots', []) if isinstance(manifest, dict) else []
                  by_id = {shot.get('id'): shot for shot in shots if isinstance(shot, dict)}
                  required = ('marion-morning', 'lucas-presence')
                  missing = [shot_id for shot_id in required if not by_id.get(shot_id, {}).get('videoUrl')]
                  if missing:
                      raise RuntimeError(f'manifest missing videoUrl for: {missing}')

                  verified = []
                  for shot_id in required:
                      video_url = urljoin(site + '/', by_id[shot_id]['videoUrl'].lstrip('/'))
                      response = requests.get(
                          f'{video_url}?run=${{ github.run_id }}',
                          timeout=30,
                          headers={
                              'Range': 'bytes=0-63',
                              'Cache-Control': 'no-cache',
                              'Pragma': 'no-cache',
                              'Accept': 'video/*,application/octet-stream,*/*',
                          },
                      )
                      if response.status_code not in (200, 206):
                          raise RuntimeError(f'{shot_id}: HTTP {response.status_code}')
                      if len(response.content) < 16 or not video_signature_ok(response.content):
                          raise RuntimeError(f'{shot_id}: public response is not a valid video')
                      verified.append({'id': shot_id, 'url': video_url, 'provider': by_id[shot_id].get('provider')})

                  print(json.dumps({'publicVerification': True, 'shots': verified}, ensure_ascii=False))
                  break
              except Exception as exc:
                  last_error = exc
                  print(f'Public verification attempt {attempt}/6 failed: {exc}', flush=True)
                  if attempt < 6:
                      time.sleep(5)
          else:
              raise SystemExit(f'Generated videos were not publicly verifiable: {last_error}')
          PY
