name: MonIA Lucas Voice Fish FR

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/monia-lucas-voice-fish-fr.yml"
      - "scripts/monia_lucas_voice_fish_fr.py"
      - "scripts/monia_video_engine.py"

permissions:
  contents: read

jobs:
  generate-lucas-fish-fr-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install MonIA Fish voice dependencies
        run: python -m pip install --disable-pip-version-check gradio_client requests pillow faster-whisper numpy

      - name: Generate direct cross-lingual Lucas French candidate
        run: python -m scripts.monia_lucas_voice_fish_fr --publish-candidate

      - name: Verify candidate publicly
        run: |
          python - <<'PY'
          import requests
          url='https://marion-lucas.marionbolomey.fr/resources/monia/generated/lucas-voice-v5-fish-fr-candidate.wav'
          r=requests.get(url,timeout=30,headers={'Range':'bytes=0-127','Cache-Control':'no-cache','Accept':'audio/*,*/*'})
          ok=r.status_code in (200,206) and len(r.content)>=44 and r.content.startswith(b'RIFF')
          print(f'candidate={url} verified={ok} status={r.status_code} bytes={len(r.content)}')
          if not ok:
              raise SystemExit('MonIA Lucas Fish French candidate public verification failed')
          PY

      - name: Candidate-only policy
        run: |
          echo "Candidate only: true"
          echo "Narrative authority: false"
          echo "Live manifest mutation: forbidden"
          echo "Reference voice: Lucas V3 English speaking candidate"
          echo "Method: direct cross-lingual zero-shot voice cloning"
          echo "Target language: French"
