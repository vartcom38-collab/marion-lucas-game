name: MonIA Lucas Fixed Voice Anchor V2

on:
  push:
    branches: [main]
    paths:
      - "scripts/monia_lucas_voice_anchor_v2.py"
      - ".github/workflows/monia-lucas-voice-anchor-v2.yml"
  workflow_dispatch:

jobs:
  generate-anchor-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow numpy
      - name: Generate one fixed Lucas anchor V2 candidate
        run: python -m scripts.monia_lucas_voice_anchor_v2 --publish-candidate
      - name: Verify public anchor V2 candidate
        run: |
          python - <<'PY'
          import requests
          url='https://marion-lucas.marionbolomey.fr/resources/monia/generated/lucas-voice-anchor-v2-video-style-fr-candidate.wav'
          r=requests.get(url,timeout=60,headers={'Cache-Control':'no-cache'})
          r.raise_for_status()
          assert len(r.content)>4096,len(r.content)
          assert r.content[:4]==b'RIFF',r.content[:12]
          print('verified',url,len(r.content))
          PY
      - name: Candidate-only policy
        run: |
          echo "Single fixed synthetic Lucas V2 anchor candidate."
          echo "Uploaded video is style/performance reference only, never a biometric cloning target."
          echo "No visio/runtime mutation and no auto-promotion."
