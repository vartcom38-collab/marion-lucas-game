name: Vite CI

on:
  push:
    branches: ["migration-vite-appdeploy", "main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Drama Director
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/drama_director.py \
            --title "CI Drama Test" \
            --location "apartment" \
            --time "evening" \
            --script $'Marion: Tu es rentré tard.\nLucas: Je sais. Désolé.' \
            --output /tmp/episode-plan.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/episode-plan.json', encoding='utf-8'))
          assert p['rules']['candidate_only'] is True
          assert p['rules']['auto_publish_live'] is False
          assert p['characters']['lucas']['canon_ref'].endswith('/lucas/reference.jpg')
          assert p['characters']['marion']['canon_ref'].endswith('/marion/reference.jpg')
          assert len(p['scenes']) == 1
          assert len(p['scenes'][0]['shots']) >= 5
          assert all(s['quality_status'] == 'pending' for s in p['scenes'][0]['shots'])
          print('Drama Director episode plan validated')
          PY

      - name: Build Vite application
        run: npm run build

      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/monia-test.html
          test -d dist/assets
          test -d dist/resources
          test -f dist/config/monia-visio-approved.json
          test -d dist/ort
          test -f dist/ort/ort-wasm-simd-threaded.mjs
          test -f dist/ort/ort-wasm-simd-threaded.wasm
          test -f src/monia/local-piper-voice.ts
          test -f src/monia/gameplay-drama-trigger.ts
          test -f config/drama-character-bible.json
          test -f scripts/drama_director.py
          grep -q '"status": "locked"' config/drama-character-bible.json
          grep -q "GAMEPLAY_DRAMA_EVENT" src/monia/long-drama-bridge.ts
          grep -q "source:'gameplay'" src/monia/gameplay-drama-trigger.ts
          ! grep -q "./src/monia/auto-scene.ts" index.html
          grep -q "./src/monia/long-drama-bridge.ts" index.html
          grep -q "@mintplex-labs/piper-tts-web" package.json
          grep -q '"onnxruntime-web": "1.18.0"' package.json
          grep -q "fr_FR-tom-medium" src/monia/local-piper-voice.ts
          grep -q "./local-piper-voice" src/monia/visio-conversation.ts
          grep -q "./local-piper-voice" src/monia/test-voice-bridge.ts
          grep -q "./local-piper-voice" src/monia/voice-engine.ts
          grep -q "LUCAS_LOCAL_VOICE_ID" src/monia/test-voice-bridge.ts
          ! grep -qi "cosyvoice" src/monia/test-voice-bridge.ts
          ! grep -Eqi "chatterbox|EDGE_SPACE|hf\.space|gradio_api" src/monia/voice-engine.ts
          ! grep -q "fetch(" src/monia/server-brain.ts
          ! grep -R -q "cdnjs.cloudflare.com/ajax/libs/onnxruntime-web" dist
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'piper-tts-web-*.js' -print -quit)"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/config/monia-visio-approved.json','utf8'));if(m.status!=='locked'||!m.fallback)process.exit(1)"
          echo "Vite build is deployable: gameplay is the Drama trigger authority, Drama Director validated, Lucas voice remains local-only, same-origin ONNX Runtime assets present, locked visio manifest present."

# Validation rerun after migrating AppDeploy binary assets.
