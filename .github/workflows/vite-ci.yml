name: Vite CI

on:
  push:
    branches: ["migration-vite-appdeploy", "main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vite application
        run: npm run build

      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          test -d dist/resources
          test -f dist/api/monia-ai.php
          test -f dist/config/monia-visio-approved.json
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/config/monia-visio-approved.json','utf8'));if(m.status!=='locked'||!m.fallback)process.exit(1)"
          echo "Vite build is deployable and contains the locked visio manifest plus MonIA server bridge."

# Validation rerun after migrating AppDeploy binary assets.
