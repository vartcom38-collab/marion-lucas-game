name: Vite CI

on:
  push:
    branches: ["migration-vite-appdeploy", "main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Drama Director
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/drama_director.py \
            --title "CI Drama Test" \
            --location "apartment" \
            --time "evening" \
            --script $'Marion: Tu es rentré tard.\nLucas: Je sais. Désolé.' \
            --output /tmp/episode-plan.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/episode-plan.json', encoding='utf-8'))
          assert p['rules']['candidate_only'] is True
          assert p['rules']['auto_publish_live'] is False
          assert p['characters']['lucas']['canon_ref'].endswith('/lucas/reference.jpg')
          assert p['characters']['marion']['canon_ref'].endswith('/marion/reference.jpg')
          assert len(p['scenes']) == 1
          assert len(p['scenes'][0]['shots']) >= 5
          assert all(s['quality_status'] == 'pending' for s in p['scenes'][0]['shots'])
          print('Drama Director episode plan validated')
          PY

      - name: Build Vite application
        run: npm run build

      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(ok, label):
              if not ok:
                  raise SystemExit(f'CI verification failed: {label}')
              print(f'OK · {label}')

          required_files = [
              'dist/index.html',
              'dist/monia-test.html',
              'dist/config/monia-visio-approved.json',
              'dist/config/drama-approved.json',
              'dist/config/motion-reference-bank.json',
              'dist/ort/ort-wasm-simd-threaded.mjs',
              'dist/ort/ort-wasm-simd-threaded.wasm',
              'src/monia/local-piper-voice.ts',
              'src/monia/gameplay-drama-trigger.ts',
              'src/monia/gameplay-visio-director.ts',
              'src/monia/drama-shot-planner.ts',
              'src/monia/long-drama.ts',
              'src/monia/long-drama-bridge.ts',
              'src/monia/drama-approval.ts',
              'src/monia/media-predictor.ts',
              'config/drama-character-bible.json',
              'config/drama-approved.json',
              'config/motion-reference-bank.json',
              'scripts/drama_director.py',
          ]
          for item in required_files:
              require(Path(item).is_file(), f'{item} exists')
          require(Path('dist/assets').is_dir(), 'dist/assets exists')
          require(Path('dist/resources').is_dir(), 'dist/resources exists')
          require(Path('dist/ort').is_dir(), 'dist/ort exists')

          bible = json.loads(Path('config/drama-character-bible.json').read_text(encoding='utf-8'))
          require(bible.get('status') == 'locked', 'Drama Character Bible is locked')

          drama_manifest = json.loads(Path('dist/config/drama-approved.json').read_text(encoding='utf-8'))
          require(drama_manifest.get('status') == 'locked', 'Drama approval manifest is locked')
          require(drama_manifest.get('policy',{}).get('fresh_generation_is_candidate_only') is True, 'fresh Drama generation is candidate-only')
          require(drama_manifest.get('policy',{}).get('auto_publish_live') is False, 'Drama auto-publish live is forbidden')

          motion = json.loads(Path('dist/config/motion-reference-bank.json').read_text(encoding='utf-8'))
          require(motion.get('policy',{}).get('motion_reference_only') is True, 'motion bank is motion-only')
          require(motion.get('policy',{}).get('copy_identity') is False, 'motion bank cannot copy identity')
          require(any('carrying_child' in r.get('tags',[]) for r in motion.get('references',[])), 'parent-child carrying motion reference registered')

          index = Path('index.html').read_text(encoding='utf-8')
          bridge = Path('src/monia/long-drama-bridge.ts').read_text(encoding='utf-8')
          approval = Path('src/monia/drama-approval.ts').read_text(encoding='utf-8')
          predictor = Path('src/monia/media-predictor.ts').read_text(encoding='utf-8')
          trigger = Path('src/monia/gameplay-drama-trigger.ts').read_text(encoding='utf-8')
          planner = Path('src/monia/drama-shot-planner.ts').read_text(encoding='utf-8')
          long_drama = Path('src/monia/long-drama.ts').read_text(encoding='utf-8')
          visio_director = Path('src/monia/gameplay-visio-director.ts').read_text(encoding='utf-8')
          require('GAMEPLAY_DRAMA_EVENT' in bridge, 'long-drama listens to gameplay trigger')
          require("source:'gameplay'" in trigger, 'Drama trigger source is gameplay')
          require('./src/monia/auto-scene.ts' not in index, 'autonomous auto-scene is disabled')
          require('./src/monia/long-drama-bridge.ts' in index, 'long-drama bridge is loaded')
          require('./src/monia/media-predictor.ts' in index, 'spoiler-safe Media Predictor is loaded')
          require('runtime.respond=async' not in bridge, 'Drama does not globally hook MonIA responses')
          require('dramaPassesQualityGate' in bridge, 'complete-scene quality gate is required')
          require('saveDramaCandidate(trigger.signature,candidate)' in bridge, 'fresh generated Drama is stored as candidate')
          require('deliverDrama(' not in bridge, 'fresh generated Drama has no direct delivery path')
          require('approvedDramaForSignature' in bridge, 'live Drama comes from approval manifest')
          require('playLongDrama(candidate)' not in bridge, 'candidate Drama cannot auto-play')
          require('fresh_generation_is_candidate_only' in Path('config/drama-approved.json').read_text(encoding='utf-8'), 'candidate-only policy is explicit')
          require("state:'candidate'" in approval, 'Drama candidate state is explicit')
          require('identity:\'pending\'' in approval and 'canon:\'pending\'' in approval, 'identity/canon validation remains pending for fresh candidates')
          require('candidateOnly:true' in predictor, 'Media Predictor only emits candidate opportunities')
          require('narrativeAuthority:false' in predictor, 'Media Predictor has zero narrative authority')
          require('reusePreviousFrame' in planner, 'shot planner marks continuity reuse')
          require('extractLastVideoFrame' in long_drama, 'runtime extracts previous video final frame')
          require('previous-video-frame' in long_drama, 'next shot can use actual previous video frame')

          require('./src/monia/gameplay-visio-director.ts' in index, 'gameplay Visio Director is loaded')
          require("source:'gameplay'" in visio_director, 'Visio requests are gameplay-authored')
          require('Ne jamais déclencher une visio de sa propre initiative.' in visio_director, 'Visio cannot self-trigger')
          require('signature(current!,request)!==sig' in visio_director, 'stale gameplay context cancels prepared visio')
          require('monia-visio-approved.json' in visio_director, 'Visio Director prewarms approved-media manifest')
          require("requestedChannel:'visio'" in visio_director, 'Visio Director requests only visio channel')

          package = Path('package.json').read_text(encoding='utf-8')
          local_voice = Path('src/monia/local-piper-voice.ts').read_text(encoding='utf-8')
          visio = Path('src/monia/visio-conversation.ts').read_text(encoding='utf-8')
          test_voice = Path('src/monia/test-voice-bridge.ts').read_text(encoding='utf-8')
          voice_engine = Path('src/monia/voice-engine.ts').read_text(encoding='utf-8')
          server_brain = Path('src/monia/server-brain.ts').read_text(encoding='utf-8')
          require('@mintplex-labs/piper-tts-web' in package, 'Piper package present')
          require('"onnxruntime-web": "1.18.0"' in package, 'ONNX Runtime pinned to 1.18.0')
          require('fr_FR-tom-medium' in local_voice, 'current local Lucas voice candidate present')
          require('./local-piper-voice' in visio, 'visio uses local voice')
          require('./local-piper-voice' in test_voice, 'test lab uses local voice')
          require('./local-piper-voice' in voice_engine, 'voice engine uses local voice')
          require('LUCAS_LOCAL_VOICE_ID' in test_voice, 'test lab reports local voice id')
          require('cosyvoice' not in test_voice.lower(), 'CosyVoice removed from test path')
          forbidden_voice = ('chatterbox', 'EDGE_SPACE', 'hf.space', 'gradio_api')
          require(not any(x.lower() in voice_engine.lower() for x in forbidden_voice), 'remote Lucas voice providers removed')
          require('fetch(' not in server_brain, 'paid server brain network path disabled')

          dist_text = ''
          for p in Path('dist').rglob('*'):
              if p.is_file() and p.suffix in {'.js','.html','.css','.mjs','.json'}:
                  try: dist_text += p.read_text(encoding='utf-8', errors='ignore')
                  except Exception: pass
          require('cdnjs.cloudflare.com/ajax/libs/onnxruntime-web' not in dist_text, 'ONNX runtime has no Cloudflare runtime dependency')
          require(any(Path('dist/assets').glob('piper-tts-web-*.js')), 'Piper bundle exists')

          manifest = json.loads(Path('dist/config/monia-visio-approved.json').read_text(encoding='utf-8'))
          require(manifest.get('status') == 'locked' and bool(manifest.get('fallback')), 'locked visio manifest has fallback')
          print('Vite build is deployable: gameplay-only Drama/Visio authority, approval-first Drama playback, spoiler-safe anticipation, motion-only reference bank, previous-frame continuity and local voice infrastructure are locked.')
          PY

# Validation rerun after migrating AppDeploy binary assets.
