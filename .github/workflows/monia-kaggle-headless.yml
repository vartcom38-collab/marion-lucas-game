name: MonIA Kaggle Headless Worker

on:
  workflow_dispatch:
  repository_dispatch:
    types: [monia_kaggle_run]

permissions:
  contents: read

jobs:
  submit-kaggle-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare Kaggle worker bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kaggle-worker
          cp notebooks/monia_kaggle_oneclick.ipynb .kaggle-worker/monia_kaggle_oneclick.ipynb
          cp kaggle/monia-worker/kernel-metadata.json .kaggle-worker/kernel-metadata.json

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Validate Kaggle token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "KAGGLE_API_TOKEN secret is missing"
            exit 2
          fi
          kaggle config view >/dev/null

      - name: Submit GPU worker without browser
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p .kaggle-worker
          echo "MonIA worker submitted to Kaggle. No notebook UI interaction required."

      - name: Wait for Kaggle completion
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="marionbolomey/monia-headless-worker"
          for attempt in $(seq 1 60); do
            STATUS="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "[$attempt/60] $STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|completed'; then
              echo "Kaggle worker completed."
              exit 0
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancelled|canceled'; then
              echo "Kaggle worker failed: $STATUS"
              exit 1
            fi
            sleep 60
          done
          echo "Timed out waiting for Kaggle worker."
          exit 1

      - name: Verify candidate returned to GitHub
        shell: bash
        run: |
          set -euo pipefail
          URL="https://api.github.com/repos/vartcom38-collab/marion-lucas-game/contents/public/resources/monia/candidates/test-kaggle-marion-001/result.json"
          for attempt in $(seq 1 10); do
            CODE="$(curl -sS -o /tmp/monia-result.json -w '%{http_code}' "$URL")"
            if [ "$CODE" = "200" ]; then
              echo "Candidate result found in GitHub."
              cat /tmp/monia-result.json
              exit 0
            fi
            echo "Candidate not visible yet (HTTP $CODE), waiting..."
            sleep 15
          done
          echo "Kaggle completed but candidate result did not return to GitHub."
          exit 1

      - name: Note
        run: |
          echo "Candidate-only pipeline complete. No approved/live manifest is modified automatically."
