          python3 <<'PY'
          import ftplib, os, time
          from pathlib import Path

          actual = os.environ.get('MONIA_ACTUAL_JOB_ID') or os.environ['MONIA_JOB_ID']
          local_root = Path('public/resources/monia/candidates') / actual
          host = os.environ['INFOMANIAK_FTP_HOST'].strip().replace('ftpes://','').replace('ftps://','').replace('ftp://','').rstrip('/')
          user = os.environ['INFOMANIAK_FTP_USER'].strip()
          password = os.environ['INFOMANIAK_FTP_PASSWORD'].rstrip('\r\n')
          if not host or not user or not password:
              raise RuntimeError('Infomaniak FTP credentials are missing')

          ftp = None
          last = None
          for attempt in range(1, 5):
              try:
                  ftp = ftplib.FTP_TLS(timeout=45)
                  ftp.connect(host, 21)
                  ftp.login(user, password)
                  ftp.prot_p()
                  ftp.set_pasv(True)
                  break
              except Exception as exc:
                  last = exc
                  try: ftp.close()
                  except Exception: pass
                  ftp = None
                  time.sleep(attempt * 5)
          if ftp is None:
              raise RuntimeError(f'Unable to connect to Infomaniak: {last}')

          remote = f'/resources/monia/candidates/{actual}'
          ftp.cwd('/')
          for part in [p for p in remote.split('/') if p]:
              try:
                  ftp.cwd(part)
              except ftplib.error_perm:
                  ftp.mkd(part)
                  ftp.cwd(part)

          for path in sorted(local_root.iterdir()):
              if not path.is_file():
                  continue
              expected = path.stat().st_size
              if expected <= 0:
                  raise RuntimeError(f'Empty candidate file: {path.name}')
              with path.open('rb') as fh:
                  ftp.storbinary(f'STOR {path.name}', fh, blocksize=1024*1024)
              ftp.voidcmd('TYPE I')
              actual_size = ftp.size(path.name)
              if actual_size != expected:
                  raise RuntimeError(f'{path.name}: remote size {actual_size}, expected {expected}')
              print('Published and verified:', path.name, expected)

          ftp.quit()
          PY

