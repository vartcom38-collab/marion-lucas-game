name: MonIA Kaggle Headless Worker

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/monia-kaggle-headless.yml'
      - 'notebooks/monia_kaggle_oneclick.ipynb'
      - 'kaggle/monia-worker/kernel-metadata.json'
      - 'studio/queue/test-kaggle-marion-001.json'
      - 'studio/queue/dominic-seated-wan22-live-001.json'
      - 'studio/queue/dominic-seated-wan22-lock-002.json'
      - 'studio/queue/dominic-seated-wan22-identity-003.json'
      - 'studio/queue/dominic-seated-monia-library-004.json'
      - 'studio/queue/dominic-seated-monia-library-005.json'
      - 'studio/queue/dominic-seated-monia-library-006.json'
      - 'studio/queue/dominic-seated-monia-library-007.json'
      - 'studio/queue/dominic-seated-monia-library-008.json'
      - 'studio/queue/dominic-seated-monia-library-009.json'
      - 'studio/queue/dominic-seated-monia-library-010.json'
      - 'studio/queue/dominic-seated-monia-library-011.json'
      - 'studio/queue/dominic-seated-monia-library-012.json'
      - 'studio/queue/dominic-seated-monia-library-013.json'
      - 'studio/queue/dominic-seated-monia-library-014.json'
      - 'studio/queue/dominic-seated-monia-library-015.json'
      - 'studio/queue/dominic-seated-monia-library-016.json'
      - 'studio/queue/dominic-seated-monia-library-017.json'
      - 'studio/queue/dominic-seated-monia-library-018.json'
      - 'config/monia-reference-packs.json'
      - 'config/monia-reference-library-router-v1.json'
      - 'config/lucas-reference-bank.json'
      - 'config/lucas-video-bank.json'
      - 'config/dominic-multiview-canon-v2.json'
      - 'config/dominic-direct-reference-pack-v3.json'
      - 'config/motion-reference-bank.json'
      - 'assets/monia-atlas/chunks/marion-*.b64'
      - 'assets/monia-atlas/lucas-priority-*.jpg.b64'
  repository_dispatch:
    types: [monia_kaggle_run]

permissions:
  contents: write

jobs:
  submit-kaggle-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      MONIA_JOB_ID: ${{ github.event.client_payload.job_id || 'dominic-seated-monia-library-018' }}
      MONIA_JOB_B64: ${{ github.event.client_payload.job_b64 || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Materialize private real Dominic references
        if: ${{ env.MONIA_JOB_ID == 'dominic-seated-monia-library-007' || env.MONIA_JOB_ID == 'dominic-seated-monia-library-008' || env.MONIA_JOB_ID == 'dominic-seated-monia-library-009' || env.MONIA_JOB_ID == 'dominic-seated-monia-library-010' || env.MONIA_JOB_ID == 'dominic-seated-monia-library-011' || env.MONIA_JOB_ID == 'dominic-seated-monia-library-012' || env.MONIA_JOB_ID == 'dominic-seated-monia-library-013' || env.MONIA_JOB_ID == 'dominic-seated-monia-library-014' || env.MONIA_JOB_ID == 'dominic-seated-monia-library-015' || env.MONIA_JOB_ID == 'dominic-seated-monia-library-016' || env.MONIA_JOB_ID == 'dominic-seated-monia-library-017' || env.MONIA_JOB_ID == 'dominic-seated-monia-library-018' }}
        env:
          INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
          INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
          INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet Pillow
          mkdir -p .private-monia/dominic
          python3 <<'PY'
          import ftplib, os
          from pathlib import Path

          host=os.environ['INFOMANIAK_FTP_HOST'].strip().replace('ftpes://','').replace('ftps://','').replace('ftp://','').rstrip('/')
          user=os.environ['INFOMANIAK_FTP_USER'].strip()
          password=os.environ['INFOMANIAK_FTP_PASSWORD'].rstrip('\r\n')
          if not host or not user or not password:
              raise RuntimeError('Infomaniak FTP credentials missing')

          ftp=ftplib.FTP_TLS(timeout=45)
          ftp.connect(host,21); ftp.login(user,password); ftp.prot_p(); ftp.set_pasv(True)
          out=Path('.private-monia/dominic')
          originals=['IMG_4468(1).jpeg','IMG_4467(1).jpeg','IMG_4466(1).jpeg','IMG_4465(1).jpeg','IMG_4425(1).jpeg','IMG_3772(3).jpeg','IMG_3771(2).jpeg','IMG_3770(1).jpeg']
          roots=['/private/monia/lucas','/private/monia/lucas/reference-bank','/private/monia/reference-vault/dominic']

          def normalize_filename(name):
              lower=name.lower()
              if '.' in lower:
                  stem, ext=lower.rsplit('.',1)
                  if stem.endswith(')') and '(' in stem:
                      prefix, suffix=stem.rsplit('(',1)
                      if suffix[:-1].isdigit():
                          stem=prefix
                  return stem+'.'+ext
              return lower

          wanted={normalize_filename(x) for x in originals}
          found=0
          for root in roots:
              try:
                  names=ftp.nlst(root)
              except Exception:
                  names=[]
              for remote in names:
                  base=remote.rsplit('/',1)[-1]
                  if normalize_filename(base) not in wanted:
                      continue
                  target=out/base
                  if target.exists():
                      continue
                  try:
                      with target.open('wb') as fh:
                          ftp.retrbinary('RETR '+remote, fh.write, blocksize=1024*1024)
                      if target.stat().st_size > 1000:
                          found += 1
                          print('Recovered Dominic original:', remote, '->', target.name)
                      else:
                          target.unlink(missing_ok=True)
                  except Exception:
                      target.unlink(missing_ok=True)

              for name in originals:
                  variants={name}
                  if '(' in name and ')' in name:
                      left=name.rsplit('(',1)[0]
                      ext='.'+name.rsplit('.',1)[1] if '.' in name else ''
                      variants.add(left+ext)
                  for variant in variants:
                      target=out/variant
                      if target.exists():
                          continue
                      try:
                          with target.open('wb') as fh:
                              ftp.retrbinary('RETR '+root+'/'+variant, fh.write, blocksize=1024*1024)
                          if target.stat().st_size > 1000:
                              found += 1
                              print('Recovered Dominic original:', root+'/'+variant, '->', target.name)
                          else:
                              target.unlink(missing_ok=True)
                      except Exception:
                          target.unlink(missing_ok=True)

          # Guaranteed legacy real-user video authority if present.
          video=out/'source.mp4'
          try:
              with video.open('wb') as fh:
                  ftp.retrbinary('RETR /private/monia/lucas/source.mp4', fh.write, blocksize=1024*1024)
              if video.stat().st_size < 10000:
                  video.unlink(missing_ok=True)
          except Exception:
              video.unlink(missing_ok=True)
          ftp.quit()
          print('Private real Dominic originals recovered:', found)
          print('Private real Dominic source video recovered:', video.exists())
          PY

          if [ -f .private-monia/dominic/source.mp4 ]; then
            for sec in 22 26 30; do
              ffmpeg -y -v error -ss "$sec" -i .private-monia/dominic/source.mp4 -frames:v 1 -q:v 2 ".private-monia/dominic/video-frame-$sec.jpg" || true
            done
            # Clean identity crop: remove phone UI bars and the second person.
            ffmpeg -y -v error -ss 26 -i .private-monia/dominic/source.mp4 -frames:v 1 \
              -vf "crop=iw*0.56:ih*0.76:iw*0.31:ih*0.08,scale=512:896:force_original_aspect_ratio=decrease,pad=512:896:(ow-iw)/2:(oh-ih)/2" \
              -q:v 2 ".private-monia/dominic/00-dominic-clean-real-anchor.jpg" || true
          fi

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('.private-monia/dominic')
          valid=[]
          for p in sorted(root.iterdir()):
              if p.suffix.lower() not in {'.jpg','.jpeg','.png','.webp'}:
                  continue
              try:
                  with Image.open(p) as im:
                      im.verify()
                  valid.append(p)
              except Exception:
                  p.unlink(missing_ok=True)
          if not valid:
              raise RuntimeError('DOMINIC_PRIVATE_REAL_REFERENCE_RECOVERY_EMPTY')
          print('Validated private real Dominic identity refs:', len(valid))
          PY

      - name: Prepare Kaggle worker bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kaggle-worker
          cp notebooks/monia_kaggle_oneclick.ipynb .kaggle-worker/monia_kaggle_oneclick.ipynb
          cp kaggle/monia-worker/kernel-metadata.json .kaggle-worker/kernel-metadata.json
          if [ -n "${MONIA_JOB_B64:-}" ]; then
            printf '%s' "$MONIA_JOB_B64" | base64 --decode > .kaggle-worker/job.json
            python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('.kaggle-worker/job.json')
          job=json.loads(p.read_text(encoding='utf-8'))
          assert job.get('id') == os.environ['MONIA_JOB_ID']
          assert job.get('candidateOnly') is True
          assert job.get('narrativeAuthority') is False
          print('Dynamic MonIA job prepared:', job['id'])
          PY
          else
            JOB_PATH="studio/queue/${MONIA_JOB_ID}.json"
            test -f "$JOB_PATH"
            cp "$JOB_PATH" .kaggle-worker/job.json
            echo "Using repository job: $JOB_PATH"
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          jobp=Path('.kaggle-worker/job.json')
          cfgp=Path('config/monia-reference-packs.json')
          job=json.loads(jobp.read_text(encoding='utf-8'))
          cfg=json.loads(cfgp.read_text(encoding='utf-8'))
          chars=cfg.get('characters',{})
          raw_base='https://raw.githubusercontent.com/vartcom38-collab/marion-lucas-game/main/'
          for ch in job.get('characters',[]):
              cid=str(ch.get('id','')).lower()
              pack=chars.get(cid)
              if not pack and cid=='lucas': pack=chars.get('dominic')
              if not pack: continue
              canon=pack.get('canonicalImage')
              if cid=='dominic' and pack.get('referenceMode')=='real-user-reference-pack-strict':
                  ch.pop('canonRef',None)
                  ch['preferCanonRefFirst']=False
              elif canon and not ch.get('canonRef'):
                  ch['canonRef']=raw_base+canon
              legacy=pack.get('legacyPriorityImages') or pack.get('priorityImages') or []
              ch['priorityImages']=[raw_base+p for p in legacy]
              embedded=[]
              for p in (pack.get('embeddedIdentityFiles') or []):
                  fp=Path(p)
                  if not fp.exists():
                      print('⚠️ Missing binary MonIA identity anchor:', p); continue
                  try:
                      raw=fp.read_bytes()
                      if raw.startswith(bytes.fromhex('ffd8')) and raw.endswith(bytes.fromhex('ffd9')):
                          embedded.append(__import__('base64').b64encode(raw).decode('ascii'))
                          print('✅ Embedded binary MonIA identity anchor:', p, len(raw), 'bytes')
                      else:
                          print('⚠️ Skipped invalid binary MonIA identity anchor:', p)
                  except Exception as exc:
                      print('⚠️ Could not embed binary MonIA identity anchor:', p, repr(exc))
              for p in legacy:
                  fp=Path(p)
                  if not fp.exists():
                      continue
                  try:
                      payload=''.join(fp.read_text(encoding='utf-8').split())
                      raw=__import__('base64').b64decode(payload + '=' * (-len(payload) % 4))
                      if raw.startswith(bytes.fromhex('ffd8')) and raw.endswith(bytes.fromhex('ffd9')):
                          embedded.append(payload)
                          print('✅ Embedded valid MonIA identity anchor:', p, len(raw), 'bytes')
                      else:
                          print('⚠️ Skipped malformed MonIA identity anchor:', p)
                  except Exception as exc:
                      print('⚠️ Could not embed MonIA identity anchor:', p, repr(exc))
              # Private real-user refs recovered on the runner have highest authority.
              if cid=='dominic':
                  import base64 as _b64
                  private_root=Path('.private-monia/dominic')
                  if private_root.exists():
                      private_files=sorted([p for p in private_root.iterdir() if p.suffix.lower() in {'.jpg','.jpeg','.png','.webp'}], key=lambda p:(0 if p.name.startswith('00-dominic-clean-real-anchor') else 1,p.name))
                      private_payloads=[]
                      for fp in private_files:
                          raw=fp.read_bytes()
                          private_payloads.append(_b64.b64encode(raw).decode('ascii'))
                          print('🔐 Embedded PRIVATE REAL Dominic reference:', fp.name, len(raw), 'bytes')
                      embedded=private_payloads + embedded
              ch['embeddedPriorityImagesB64']=embedded
              ch['moniaLibraryRules']=pack.get('rules') or []
              ch['moniaLibraryVideo']=pack.get('video') or None
              ch['referenceMode']=pack.get('referenceMode')
          # Hard provenance gate for Dominic: real user-supplied/user-video-derived refs only.
          for ch in job.get('characters',[]):
              if str(ch.get('id','')).lower()!='dominic':
                  continue
              if ch.get('requireRealUserIdentity'):
                  forbidden=(chars.get('dominic') or {}).get('forbiddenGeneratedIdentityFiles') or []
                  canon=str(ch.get('canonRef') or '')
                  if canon and any(x in canon for x in forbidden):
                      raise RuntimeError('DOMINIC_FORBIDDEN_GENERATED_IDENTITY_SOURCE: '+canon)
                  real_count=len(ch.get('embeddedPriorityImagesB64') or []) + len(ch.get('priorityImages') or [])
                  if real_count < 2:
                      raise RuntimeError('DOMINIC_REAL_IDENTITY_PACK_INCOMPLETE')
                  print('🔐 Dominic provenance gate: real-reference pack only, refs=',real_count)
          jobp.write_text(json.dumps(job,ensure_ascii=False,indent=2),encoding='utf-8')
          print('✅ Enrich job from MonIA canonical library:', [c.get('id') for c in job.get('characters',[])])
          PY

          python - <<'PY'
          import base64, json
          from pathlib import Path
          nb_path=Path('.kaggle-worker/monia_kaggle_oneclick.ipynb')
          job_path=Path('.kaggle-worker/job.json')
          nb=json.loads(nb_path.read_text(encoding='utf-8'))
          payload=base64.b64encode(job_path.read_bytes()).decode('ascii')
          cell={
              'cell_type':'code','execution_count':None,'metadata':{},'outputs':[],
              'source':['import base64\n','from pathlib import Path\n',f"Path('/kaggle/working/job.json').write_bytes(base64.b64decode('{payload}'))\n","print('✅ Bundled MonIA job materialized')\n"],
          }
          nb['cells'].insert(1,cell)
          nb_path.write_text(json.dumps(nb,ensure_ascii=False,indent=1),encoding='utf-8')
          print('Embedded job payload into Kaggle notebook:', job_path)
          PY

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Validate Kaggle token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "KAGGLE_API_TOKEN secret is missing"
            exit 2
          fi
          kaggle config view >/dev/null

      - name: Submit GPU worker without browser
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p .kaggle-worker
          echo "MonIA worker submitted to Kaggle for $MONIA_JOB_ID."

      - name: Wait for Kaggle completion
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="marionbolomey/monia-headless-worker"
          for attempt in $(seq 1 60); do
            STATUS="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "[$attempt/60] $STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|completed'; then
              CHECK="/tmp/monia-kaggle-id-check"
              rm -rf "$CHECK"; mkdir -p "$CHECK"
              kaggle kernels output "$KERNEL" -p "$CHECK" -o >/dev/null 2>&1 || true
              ACTUAL=""
              if [ -f "$CHECK/job.json" ]; then
                ACTUAL="$(python -c "import json; print(json.load(open('$CHECK/job.json')).get('id',''))" 2>/dev/null || true)"
              fi
              echo "Completed output job id: ${ACTUAL:-missing}; requested: $MONIA_JOB_ID"
              if [ "$ACTUAL" = "$MONIA_JOB_ID" ]; then
                echo "Kaggle worker completed for the requested MonIA job."
                exit 0
              fi
              echo "Ignoring stale completed output and waiting for the new Kaggle run."
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancelled|canceled'; then
              echo "Kaggle worker failed: $STATUS"
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for Kaggle worker."
          exit 1

      - name: Print Kaggle logs on failure
        if: failure()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set +e
          KERNEL="marionbolomey/monia-headless-worker"
          echo "===== Kaggle notebook logs ====="
          kaggle kernels logs "$KERNEL"
          echo "===== Kaggle output files ====="
          mkdir -p /tmp/monia-kaggle-output
          kaggle kernels output "$KERNEL" -p /tmp/monia-kaggle-output -o
          find /tmp/monia-kaggle-output -maxdepth 3 -type f -print

      - name: Download MonIA candidates from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="marionbolomey/monia-headless-worker"
          OUT="/tmp/monia-kaggle-output"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          kaggle kernels output "$KERNEL" -p "$OUT" -o
          ACTUAL_JOB_ID="$(python -c "import json; print(json.load(open('$OUT/job.json'))['id'])")"
          echo "Requested job id: $MONIA_JOB_ID; actual bundled job id: $ACTUAL_JOB_ID"
          echo "MONIA_ACTUAL_JOB_ID=$ACTUAL_JOB_ID" >> "$GITHUB_ENV"
          SRC="$OUT/monia-studio/$ACTUAL_JOB_ID"
          test -f "$SRC/result.json"
          DEST="public/resources/monia/candidates/$ACTUAL_JOB_ID"
          export MONIA_ACTUAL_JOB_ID="$ACTUAL_JOB_ID"
          mkdir -p "$DEST"
          cp "$SRC/result.json" "$DEST/result.json"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          actual=os.environ.get('MONIA_ACTUAL_JOB_ID') or os.environ['MONIA_JOB_ID']
          src=Path('/tmp/monia-kaggle-output/monia-studio')/actual
          dest=Path('public/resources/monia/candidates')/actual
          data=json.loads((src/'result.json').read_text(encoding='utf-8'))
          clips=data.get('clips') or []
          assert 1 <= len(clips) <= 6
          for name in clips:
              assert name.startswith('shot-') and name.endswith('.mp4') and '/' not in name
              assert (src/name).is_file(), name
              shutil.copy2(src/name,dest/name)
          lock_report=src/'identity-lock-report.json'
          if lock_report.is_file():
              shutil.copy2(lock_report,dest/'identity-lock-report.json')
              print('Collected identity lock report:', lock_report)
          print('Collected clips:', clips)
          PY

      - name: Validate candidate safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          actual=os.environ.get('MONIA_ACTUAL_JOB_ID') or os.environ['MONIA_JOB_ID']
          p=Path('public/resources/monia/candidates')/actual/'result.json'
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data.get('jobId') == actual
          assert data.get('state') == 'candidate'
          assert data.get('candidateOnly') is True
          assert data.get('narrativeAuthority') is False
          assert data.get('selectionMode') == 'surprise-auto'
          clips=data.get('clips') or []
          assert 1 <= len(clips) <= 6
          for name in clips:
              assert (p.parent/name).is_file()
          print('MonIA candidate safety flags verified for', len(clips), 'clip(s).')
          PY

      - name: Run V3 quality preflight and capture continuity frame
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ACTUAL="${MONIA_ACTUAL_JOB_ID:-$MONIA_JOB_ID}"
          DEST="public/resources/monia/candidates/$ACTUAL"
          CLIP="$(python -c "import json; d=json.load(open('$DEST/result.json')); print(d['clips'][0])")"
          python tools/monia-video-quality.py "$DEST/$CLIP" > "$DEST/technical-quality.json" || true
          ACTOR_COUNT="$(python -c "import json; j=json.load(open('.kaggle-worker/job.json')); print(len(j.get('characters',[])))")"
          REF=""
          if [ "$ACTOR_COUNT" -eq 1 ]; then
            if python -c "import json; j=json.load(open('.kaggle-worker/job.json')); x=str((j.get('characters') or [{}])[0].get('id','')).lower(); raise SystemExit(0 if x in {'lucas','dominic'} else 1)"; then
              REF="public/resources/monia/canon/lucas/reference.jpg"
            elif [ -f "public/resources/photo.png" ]; then
              REF="public/resources/photo.png"
            fi
            FACE_ARGS=()
            [ -n "$REF" ] && FACE_ARGS=(--reference "$REF")
            python tools/monia-face-consistency.py "$DEST/$CLIP" "${FACE_ARGS[@]}" > "$DEST/identity-quality.json" || true
          else
            # A single-reference face score is unsafe for shared shots: the largest detected face may be the other actor.
            # Keep temporal/presence preflight only and force semantic review of every canonical actor.
            python tools/monia-face-consistency.py "$DEST/$CLIP" > "$DEST/identity-quality.json" || true
          fi
          ffmpeg -y -v error -sseof -0.08 -i "$DEST/$CLIP" -frames:v 1 -q:v 2 "$DEST/continuity-last-frame.jpg"
          python - <<'PY'
          import json, os
          from pathlib import Path
          actual=os.environ.get('MONIA_ACTUAL_JOB_ID') or os.environ['MONIA_JOB_ID']
          d=Path('public/resources/monia/candidates')/actual
          tech=json.loads((d/'technical-quality.json').read_text())
          ident=json.loads((d/'identity-quality.json').read_text())
          reasons=list(tech.get('reasons') or [])+list(ident.get('reasons') or [])
          report={
            'version':3,'jobId':actual,
            'technicalPass':tech.get('status')=='pass',
            'identityBackendAvailable':ident.get('available') is True,
            'multiActorShot':len(json.loads(Path('.kaggle-worker/job.json').read_text()).get('characters',[]))>1,
            'identityScore':None if len(json.loads(Path('.kaggle-worker/job.json').read_text()).get('characters',[]))>1 else ident.get('identityScore'),
            'temporalIdentityScore':ident.get('temporalIdentityScore'),
            'facePresenceRate':ident.get('facePresenceRate'),
            'autoReject':tech.get('status')=='reject' or ident.get('autoReject') is True,
            'reasons':reasons,
            'humanApprovalRequired':True,
            'continuityLastFrame':'continuity-last-frame.jpg',
            'note':'Automatic checks may reject obvious failures. They never auto-publish a candidate.'
          }
          (d/'quality-v3.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit MonIA candidates to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
