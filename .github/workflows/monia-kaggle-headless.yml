name: MonIA Kaggle Headless Worker

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/monia-kaggle-headless.yml'
      - 'notebooks/monia_kaggle_oneclick.ipynb'
      - 'kaggle/monia-worker/kernel-metadata.json'
  repository_dispatch:
    types: [monia_kaggle_run]

permissions:
  contents: write

jobs:
  submit-kaggle-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare Kaggle worker bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kaggle-worker
          cp notebooks/monia_kaggle_oneclick.ipynb .kaggle-worker/monia_kaggle_oneclick.ipynb
          cp kaggle/monia-worker/kernel-metadata.json .kaggle-worker/kernel-metadata.json

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Validate Kaggle token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "KAGGLE_API_TOKEN secret is missing"
            exit 2
          fi
          kaggle config view >/dev/null

      - name: Submit GPU worker without browser
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p .kaggle-worker
          echo "MonIA worker submitted to Kaggle."

      - name: Wait for Kaggle completion
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="marionbolomey/monia-headless-worker"
          for attempt in $(seq 1 60); do
            STATUS="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "[$attempt/60] $STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|completed'; then
              echo "Kaggle worker completed."
              exit 0
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancelled|canceled'; then
              echo "Kaggle worker failed: $STATUS"
              exit 1
            fi
            sleep 60
          done
          echo "Timed out waiting for Kaggle worker."
          exit 1

      - name: Print Kaggle logs on failure
        if: failure()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set +e
          KERNEL="marionbolomey/monia-headless-worker"
          echo "===== Kaggle notebook logs ====="
          kaggle kernels logs "$KERNEL"
          echo "===== Kaggle output files ====="
          mkdir -p /tmp/monia-kaggle-output
          kaggle kernels output "$KERNEL" -p /tmp/monia-kaggle-output -o
          find /tmp/monia-kaggle-output -maxdepth 3 -type f -print

      - name: Download surprise candidates from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="marionbolomey/monia-headless-worker"
          OUT="/tmp/monia-kaggle-output"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          kaggle kernels output "$KERNEL" -p "$OUT" -o
          SRC="$OUT/monia-studio/test-kaggle-marion-001"
          test -f "$SRC/shot-01.mp4"
          test -f "$SRC/shot-02.mp4"
          test -f "$SRC/result.json"
          DEST="public/resources/monia/candidates/test-kaggle-marion-001"
          mkdir -p "$DEST"
          cp "$SRC/shot-01.mp4" "$DEST/shot-01.mp4"
          cp "$SRC/shot-02.mp4" "$DEST/shot-02.mp4"
          cp "$SRC/result.json" "$DEST/result.json"

      - name: Validate candidate safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/resources/monia/candidates/test-kaggle-marion-001/result.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data.get('state') == 'candidate'
          assert data.get('candidateOnly') is True
          assert data.get('narrativeAuthority') is False
          assert data.get('selectionMode') == 'surprise-auto'
          assert data.get('clips') == ['shot-01.mp4','shot-02.mp4']
          print('Two-candidate surprise safety flags verified.')
          PY

      - name: Commit surprise candidates to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/resources/monia/candidates/test-kaggle-marion-001/shot-01.mp4
          git add public/resources/monia/candidates/test-kaggle-marion-001/shot-02.mp4
          git add public/resources/monia/candidates/test-kaggle-marion-001/result.json
          if git diff --cached --quiet; then
            echo "Candidates unchanged; nothing to commit."
          else
            git commit -m "MonIA surprise candidate pair test-kaggle-marion-001"
            git push origin HEAD:main
          fi

      - name: Note
        run: |
          echo "Two surprise candidates collected. No approved/live manifest is modified automatically."
