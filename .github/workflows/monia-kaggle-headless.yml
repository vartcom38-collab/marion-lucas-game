      - name: Validate Kaggle token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "KAGGLE_API_TOKEN secret is missing"
            exit 2
          fi
          kaggle config view >/dev/null

      - name: Submit GPU worker without browser
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p .kaggle-worker
          echo "MonIA worker submitted to Kaggle for $MONIA_JOB_ID."

      - name: Wait for Kaggle completion
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="marionbolomey/monia-headless-worker"
          for attempt in $(seq 1 60); do
            STATUS="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "[$attempt/60] $STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|completed'; then
              CHECK="/tmp/monia-kaggle-id-check"
              rm -rf "$CHECK"; mkdir -p "$CHECK"
              kaggle kernels output "$KERNEL" -p "$CHECK" -o >/dev/null 2>&1 || true
              ACTUAL=""
              if [ -f "$CHECK/job.json" ]; then
                ACTUAL="$(python -c "import json; print(json.load(open('$CHECK/job.json')).get('id',''))" 2>/dev/null || true)"
              fi
              echo "Completed output job id: ${ACTUAL:-missing}; requested: $MONIA_JOB_ID"
              if [ "$ACTUAL" = "$MONIA_JOB_ID" ]; then
                echo "Kaggle worker completed for the requested MonIA job."
                exit 0
              fi
              echo "Ignoring stale completed output and waiting for the new Kaggle run."
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancelled|canceled'; then
              echo "Kaggle worker failed: $STATUS"
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for Kaggle worker."
          exit 1

