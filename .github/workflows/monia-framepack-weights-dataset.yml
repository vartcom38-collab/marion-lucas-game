name: Build FramePack Persistent Weight Dataset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/monia-framepack-weights-dataset.yml'

permissions:
  contents: write

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install tooling
        run: python -m pip install --upgrade kaggle huggingface_hub

      - name: Download official FramePack F1 weights once
        env:
          HF_HOME: ${{ runner.temp }}/hf
          HF_HUB_DISABLE_XET: "1"
        run: |
          set -euo pipefail
          mkdir -p framepack-weights
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="lllyasviel/FramePack_F1_I2V_HY_20250503",
              local_dir="framepack-weights/FramePack_F1_I2V_HY_20250503",
          )
          snapshot_download(
              repo_id="hunyuanvideo-community/HunyuanVideo",
              local_dir="framepack-weights/HunyuanVideo",
              allow_patterns=[
                  "text_encoder/**", "text_encoder_2/**",
                  "tokenizer/**", "tokenizer_2/**", "vae/**",
              ],
          )
          snapshot_download(
              repo_id="lllyasviel/flux_redux_bfl",
              local_dir="framepack-weights/flux_redux_bfl",
              allow_patterns=["feature_extractor/**", "image_encoder/**"],
          )
          PY
          du -sh framepack-weights

      - name: Persist Marion FramePack anchor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p framepack-weights/references
          python - <<'PY'
          import urllib.request
          url='https://cdn.openart.ai/openart-uploads/production/attachment-transfers/20f4695a631aec334010eacc4c21c17cc0be959070b4d2c5eeafdce55c564573.png'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req,timeout=60) as r, open('framepack-weights/marion-framepack-anchor.png','wb') as f:
                  f.write(r.read())
          except Exception as e:
              raise SystemExit(f'Marion anchor bootstrap failed; keep previous dataset version and retry from a durable source: {e}')
          PY
          test -s framepack-weights/marion-framepack-anchor.png

      - name: Prepare private Kaggle dataset metadata
        run: |
          cat > framepack-weights/dataset-metadata.json <<'JSON'
          {"title":"MonIA FramePack F1 Weights","id":"marionbolomey/monia-framepack-f1-weights","licenses":[{"name":"other"}],"isPrivate":true}
          JSON

      - name: Publish persistent private dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          if kaggle datasets files marionbolomey/monia-framepack-f1-weights >/dev/null 2>&1; then
            kaggle datasets version -p framepack-weights -m "Refresh official FramePack F1 weights" --dir-mode zip
          else
            kaggle datasets create -p framepack-weights --dir-mode zip
          fi

      - name: Verify dataset exists
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          FILES=""
          for attempt in $(seq 1 30); do
            FILES="$(kaggle datasets files marionbolomey/monia-framepack-f1-weights --page-size 1000 2>&1 || true)"
            if echo "$FILES" | grep -q 'HunyuanVideo/' && echo "$FILES" | grep -q 'flux_redux_bfl/' && echo "$FILES" | grep -q 'FramePack_F1_I2V_HY_20250503/' && echo "$FILES" | grep -q 'marion-framepack-anchor.png'; then
              echo "Persistent dataset version is complete after $attempt checks"
              break
            fi
            echo "[$attempt/30] waiting for Kaggle dataset version propagation"
            sleep 20
          done
          echo "$FILES" | head -100
          echo "$FILES" | grep -q 'HunyuanVideo/'
          echo "$FILES" | grep -q 'flux_redux_bfl/'
          echo "$FILES" | grep -q 'FramePack_F1_I2V_HY_20250503/'
          echo "$FILES" | grep -q 'marion-framepack-anchor.png'

      - name: Persist dataset build status
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set +e
          mkdir -p status
          FILES="$(kaggle datasets files marionbolomey/monia-framepack-f1-weights --page-size 1000 2>&1)"
          export DATASET_FILES="$FILES"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          files=os.environ.get("DATASET_FILES","")
          payload={
            "version":1,
            "workflow":"monia-framepack-weights-dataset",
            "updatedAt":datetime.now(timezone.utc).isoformat(),
            "githubRunId":os.environ.get("GITHUB_RUN_ID"),
            "githubSha":os.environ.get("GITHUB_SHA"),
            "dataset":"marionbolomey/monia-framepack-f1-weights",
            "hasFramePack":"FramePack_F1_I2V_HY_20250503/" in files,
            "hasHunyuan":"HunyuanVideo/" in files,
            "hasFluxRedux":"flux_redux_bfl/" in files,
            "hasMarionAnchor":"marion-framepack-anchor.png" in files,
            "filesTail":files[-12000:],
          }
          with open("status/monia-framepack-dataset-latest.json","w",encoding="utf-8") as fh:
            json.dump(payload,fh,ensure_ascii=False,indent=2); fh.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/monia-framepack-dataset-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "ci: persist latest FramePack dataset status"
          git pull --rebase origin main
          git push origin HEAD:main
