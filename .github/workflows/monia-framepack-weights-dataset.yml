name: Build FramePack Persistent Weight Dataset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/monia-framepack-weights-dataset.yml'

permissions:
  contents: read

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install tooling
        run: python -m pip install --upgrade kaggle huggingface_hub

      - name: Download official FramePack F1 weights once
        env:
          HF_HOME: ${{ runner.temp }}/hf
          HF_HUB_DISABLE_XET: "1"
        run: |
          set -euo pipefail
          mkdir -p framepack-weights
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id="lllyasviel/FramePack_F1_I2V_HY_20250503", local_dir="framepack-weights/FramePack_F1_I2V_HY_20250503")
snapshot_download(
    repo_id="hunyuanvideo-community/HunyuanVideo",
    local_dir="framepack-weights/HunyuanVideo",
    allow_patterns=["text_encoder/**","text_encoder_2/**","tokenizer/**","tokenizer_2/**","vae/**"]
)
snapshot_download(
    repo_id="lllyasviel/flux_redux_bfl",
    local_dir="framepack-weights/flux_redux_bfl",
    allow_patterns=["feature_extractor/**","image_encoder/**"]
)
          PY
          du -sh framepack-weights

      - name: Prepare private Kaggle dataset metadata
        run: |
          cat > framepack-weights/dataset-metadata.json <<'JSON'
          {"title":"MonIA FramePack F1 Weights","id":"marionbolomey/monia-framepack-f1-weights","licenses":[{"name":"other"}],"isPrivate":true}
          JSON

      - name: Publish persistent private dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          if kaggle datasets files marionbolomey/monia-framepack-f1-weights >/dev/null 2>&1; then
            kaggle datasets version -p framepack-weights -m "Refresh official FramePack F1 weights" --dir-mode zip
          else
            kaggle datasets create -p framepack-weights --dir-mode zip
          fi

      - name: Verify dataset exists
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle datasets files marionbolomey/monia-framepack-f1-weights | head -50
