name: MonIA FramePack GPU Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'notebooks/monia_framepack_kaggle.ipynb'
      - '.github/workflows/monia-framepack-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Prepare isolated FramePack kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .framepack-worker
          cp notebooks/monia_framepack_kaggle.ipynb .framepack-worker/monia_framepack_kaggle.ipynb
          cat > .framepack-worker/kernel-metadata.json <<'JSON'
          {
            "id":"marionbolomey/monia-framepack-probe",
            "title":"MonIA FramePack Probe",
            "code_file":"monia_framepack_kaggle.ipynb",
            "language":"python",
            "kernel_type":"notebook",
            "is_private":true,
            "enable_gpu":true,
            "enable_internet":true,
            "machine_shape":"NvidiaTeslaT4",
            "dataset_sources":["marionbolomey/monia-framepack-f1-weights"],
            "competition_sources":[],
            "kernel_sources":[],
            "model_sources":[]
          }
          JSON
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Submit FramePack probe
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          kaggle kernels push -p .framepack-worker
      - name: Wait for FramePack probe
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="marionbolomey/monia-framepack-probe"
          for attempt in $(seq 1 25); do
            STATUS="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "[$attempt/25] $STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|completed'; then exit 0; fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancelled|canceled'; then
              kaggle kernels logs "$KERNEL" || true
              exit 1
            fi
            sleep 60
          done
          exit 1
      - name: Print FramePack logs
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels logs marionbolomey/monia-framepack-probe || true
      - name: Persist FramePack probe status
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set +e
          mkdir -p status
          STATUS="$(kaggle kernels status marionbolomey/monia-framepack-probe 2>&1)"
          LOGS="$(kaggle kernels logs marionbolomey/monia-framepack-probe 2>&1)"
          export STATUS_TEXT="$STATUS"
          export LOG_TAIL="$LOGS"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "version": 1,
              "workflow": "monia-framepack-probe",
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "githubRunId": os.environ.get("GITHUB_RUN_ID"),
              "githubSha": os.environ.get("GITHUB_SHA"),
              "kaggleKernel": "marionbolomey/monia-framepack-probe",
              "status": os.environ.get("STATUS_TEXT", ""),
              "logTail": os.environ.get("LOG_TAIL", "")[-12000:],
          }
          with open("status/monia-framepack-latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/monia-framepack-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "ci: persist latest FramePack probe status"
          git pull --rebase origin main
          git push origin HEAD:main
