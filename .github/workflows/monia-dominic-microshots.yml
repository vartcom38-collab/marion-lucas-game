name: MonIA Dominic Microshots

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/monia_dominic_microshots.py"
      - "scripts/monia_intro_worker.py"
      - ".github/workflows/monia-dominic-microshots.yml"

permissions:
  contents: read

concurrency:
  group: monia-dominic-microshots
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check gradio_client pillow requests

      - name: Generate Dominic microshots
        run: python -m scripts.monia_dominic_microshots

      - name: Upload Dominic microshot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monia-dominic-microshots-${{ github.run_id }}
          path: .monia-dominic-microshots
          if-no-files-found: warn
          include-hidden-files: true

      - name: Verify public microshots
        run: |
          python - <<'PY'
          import requests
          base='https://marion-lucas.marionbolomey.fr/resources/monia/generated/dominic-microshots'
          paths=['dominic-seated-thought.mp4','dominic-window.mp4','dominic-offscreen-reaction.mp4','manifest.json']
          for name in paths:
              r=requests.get(f'{base}/{name}?run=${{ github.run_id }}',timeout=30,headers={'Cache-Control':'no-cache'})
              if not r.ok or len(r.content)<1024:
                  raise SystemExit(f'Public verification failed {name}: HTTP {r.status_code} bytes={len(r.content)}')
              print(f'publicVerification true {name} bytes={len(r.content)}')
          PY
