name: Deploy Marion & Lucas to Infomaniak

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: marion-lucas-infomaniak-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.INFOMANIAK_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vite application
        run: npm run build

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy dist to Infomaniak over SFTP
        env:
          INFOMANIAK_HOST: ${{ secrets.INFOMANIAK_HOST }}
          INFOMANIAK_USER: ${{ secrets.INFOMANIAK_USER }}
          INFOMANIAK_PASSWORD: ${{ secrets.INFOMANIAK_PASSWORD }}
          INFOMANIAK_PATH: ${{ secrets.INFOMANIAK_PATH }}
        run: |
          test -n "$INFOMANIAK_HOST"
          test -n "$INFOMANIAK_USER"
          test -n "$INFOMANIAK_PASSWORD"
          test -n "$INFOMANIAK_PATH"
          lftp -u "$INFOMANIAK_USER","$INFOMANIAK_PASSWORD" -p 22 "sftp://$INFOMANIAK_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm yes
          mirror --reverse --delete --verbose --exclude-glob .well-known/ dist/ "$INFOMANIAK_PATH/"
          bye
          LFTP
