name: Deploy to Infomaniak

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infomaniak-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/resources

      - name: Install FTPES client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy dist to Infomaniak via FTPES
        env:
          INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
          INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
          INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${INFOMANIAK_FTP_HOST:?Missing INFOMANIAK_FTP_HOST}"
          : "${INFOMANIAK_FTP_USER:?Missing INFOMANIAK_FTP_USER}"
          : "${INFOMANIAK_FTP_PASSWORD:?Missing INFOMANIAK_FTP_PASSWORD}"
          lftp <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate yes
          open -p 21 "${INFOMANIAK_FTP_HOST}"
          user "${INFOMANIAK_FTP_USER}" "${INFOMANIAK_FTP_PASSWORD}"
          mirror --reverse --delete --verbose --parallel=4 dist/ /sites/marion-lucas.marionbolomey.fr/
          bye
          LFTP
