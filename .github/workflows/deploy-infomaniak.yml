name: Deploy to Infomaniak

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infomaniak-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Living-world MP4 generation is deliberately NOT part of production deploy.
      # It previously blocked the deployment queue for 20+ minutes.
      # Those media assets are generated separately and committed/published independently.

      - name: Materialize canonical Marion reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/resources/monia/canon/marion
          if cat assets/monia-atlas/chunks/marion-00.b64 assets/monia-atlas/chunks/marion-01.b64 assets/monia-atlas/chunks/marion-02.b64 assets/monia-atlas/chunks/marion-03.b64 assets/monia-atlas/chunks/marion-04.b64 | tr -d '[:space:]' | base64 --decode > public/resources/monia/canon/marion/reference.webp 2>/dev/null && file public/resources/monia/canon/marion/reference.webp | grep -qi 'Web/P image'; then
            echo "Archival Marion atlas materialized."
          else
            echo "Archival Marion atlas incomplete; using existing public fallback for deployment only."
            rm -f public/resources/monia/canon/marion/reference.webp
            cp public/resources/photo.png public/resources/monia/canon/marion/reference.png
          fi

      - name: Build Vite application
        run: npm run build

      - name: Materialize derived bridge auth hash
        env:
          INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INFOMANIAK_FTP_PASSWORD"
          token="$(printf '%s' "$INFOMANIAK_FTP_PASSWORD" | openssl dgst -sha256 -hmac 'monia-reference-bridge-v1' -binary | base64 -w0)"
          echo "::add-mask::$token"
          hash="$(TOKEN="$token" php -r 'echo password_hash(getenv("TOKEN"), PASSWORD_DEFAULT);')"
          printf "<?php return '%s';\n" "$hash" > dist/api/.monia-reference-bridge-auth.php

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          test -d dist/resources
          mkdir -p dist/config
          cp config/monia-visio-approved.json dist/config/monia-visio-approved.json
          printf '%s' "$GITHUB_SHA" > dist/deploy-version.txt
          echo "Core playable build verified; deployment fingerprint written."

      - name: Deploy dist to Infomaniak via FTPES
        env:
          INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
          INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
          INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ftplib
          import os
          import time
          from pathlib import Path

          host = os.environ['INFOMANIAK_FTP_HOST'].strip().replace('ftpes://', '').replace('ftps://', '').replace('ftp://', '').rstrip('/')
          user = os.environ['INFOMANIAK_FTP_USER'].strip()
          password = os.environ['INFOMANIAK_FTP_PASSWORD'].rstrip('\r\n')
          local_root = Path('dist')
          # Production deploy is code/config-first. Large generated media are immutable
          # and published by their dedicated generation workflows; re-uploading them
          # on every code push is slow and can stall FTPES for many minutes.
          skip_roots = (
              'resources/monia/candidates/',
              'resources/monia/generated/',
          )

          ftp = None
          last_connect_error = None
          for connect_attempt in range(1, 5):
              try:
                  ftp = ftplib.FTP_TLS(timeout=45)
                  ftp.connect(host, 21)
                  ftp.login(user, password)
                  ftp.prot_p()
                  ftp.set_pasv(True)
                  break
              except OSError as exc:
                  last_connect_error = exc
                  try:
                      ftp.close()
                  except Exception:
                      pass
                  ftp = None
                  time.sleep(connect_attempt * 8)
          if ftp is None:
              raise RuntimeError(f'Unable to reach Infomaniak FTPES after retries: {last_connect_error}')
          remote_root = '/'

          def ensure_remote_dir(path: str):
              parts = [p for p in path.split('/') if p]
              ftp.cwd('/')
              for part in parts:
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          def remote_dir_for(local_dir: Path) -> str:
              rel = local_dir.relative_to(local_root)
              return remote_root if str(rel) == '.' else '/' + rel.as_posix()

          def remote_size(remote_dir: str, filename: str):
              ftp.cwd(remote_dir)
              try:
                  ftp.voidcmd('TYPE I')
                  return ftp.size(filename)
              except ftplib.all_errors:
                  return None

          def upload_verified(local_path: Path, remote_dir: str, atomic=False):
              ensure_remote_dir(remote_dir)
              ftp.cwd(remote_dir)
              expected = local_path.stat().st_size
              if expected <= 0:
                  raise RuntimeError(f'Refusing to deploy empty file: {local_path}')
              final_name = local_path.name
              upload_name = f'.{final_name}.uploading' if atomic else final_name
              last_error = None
              for attempt in range(1, 4):
                  try:
                      ftp.cwd(remote_dir)
                      with local_path.open('rb') as fh:
                          ftp.storbinary(f'STOR {upload_name}', fh, blocksize=1024 * 1024)
                      actual = remote_size(remote_dir, upload_name)
                      if actual != expected:
                          raise RuntimeError(f'{upload_name}: remote size {actual}, expected {expected}')
                      if atomic:
                          ftp.cwd(remote_dir)
                          try:
                              ftp.delete(final_name)
                          except ftplib.all_errors:
                              pass
                          ftp.rename(upload_name, final_name)
                      return
                  except Exception as exc:
                      last_error = exc
                      time.sleep(attempt * 2)
              raise RuntimeError(f'Upload failed after retries for {local_path}: {last_error}')

          entrypoints = {
              local_root / 'index.html',
              local_root / 'monia-test.html',
              local_root / 'latest-visio.html',
          }

          for root, dirs, files in os.walk(local_root):
              local_dir = Path(root)
              remote_dir = remote_dir_for(local_dir)
              for filename in files:
                  local_path = local_dir / filename
                  rel = local_path.relative_to(local_root).as_posix()
                  if local_path in entrypoints or any(rel.startswith(prefix) for prefix in skip_roots):
                      continue
                  upload_verified(local_path, remote_dir)

          for entrypoint in ('latest-visio.html', 'monia-test.html', 'index.html'):
              local_path = local_root / entrypoint
              if local_path.exists():
                  upload_verified(local_path, remote_root, atomic=True)

          ftp.quit()
          PY

      - name: Verify public site and entry assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://marion-lucas.marionbolomey.fr'
          html="$(curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 45 "$base/?deploy=${GITHUB_SHA}")"
          version="$(curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 45 "$base/deploy-version.txt?deploy=${GITHUB_SHA}")"
          test "$version" = "$GITHUB_SHA"
          asset="$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js"' | head -1 | cut -d'"' -f2)"
          test -n "$asset"
          case "$asset" in
            http*) asset_url="$asset" ;;
            /*) asset_url="$base$asset" ;;
            *) asset_url="$base/${asset#./}" ;;
          esac
          curl -fsSI --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 45 "$asset_url?deploy=${GITHUB_SHA}" >/dev/null
          echo "Public site serves this exact deployment and its JS entry asset."
