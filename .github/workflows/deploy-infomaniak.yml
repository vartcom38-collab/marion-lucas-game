name: Deploy to Infomaniak

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infomaniak-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Generate living world loops
        shell: bash
        run: |
          set -euo pipefail
          node tools/generate-living-loops.mjs
          find public/resources/living -maxdepth 1 -type f -name '*.mp4' -print || true

      - name: Build Vite application
        run: npm run build

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/monia-test.html
          test -d dist/assets
          test -d dist/resources
          test -f dist/api/monia-media-store.php
          test -f dist/api/monia-ai.php
          test -f dist/resources/living/home.mp4
          test -f dist/config/monia-visio-approved.json
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/config/monia-visio-approved.json','utf8'));if(m.status!=='locked'||!m.fallback)process.exit(1)"

      - name: Deploy dist to Infomaniak via FTPES
        env:
          INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
          INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
          INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ftplib
          import os
          import time
          from pathlib import Path

          host = os.environ['INFOMANIAK_FTP_HOST'].strip().replace('ftpes://', '').replace('ftps://', '').replace('ftp://', '').rstrip('/')
          user = os.environ['INFOMANIAK_FTP_USER'].strip()
          password = os.environ['INFOMANIAK_FTP_PASSWORD'].rstrip('\r\n')
          local_root = Path('dist')

          ftp = ftplib.FTP_TLS(timeout=45)
          ftp.connect(host, 21)
          ftp.login(user, password)
          ftp.prot_p()
          ftp.set_pasv(True)

          # This Infomaniak FTP account is already chrooted to the site's
          # document root. Deploying to /sites/... creates a nested folder and
          # leaves the real public index untouched. The live document root is /.
          remote_root = '/'
          print(f'FTP login root: {ftp.pwd()}')
          print('Deploying Marion & Lucas directly to FTP / (public document root).')

          def ensure_remote_dir(path: str):
              parts = [p for p in path.split('/') if p]
              ftp.cwd('/')
              for part in parts:
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          def remote_dir_for(local_dir: Path) -> str:
              rel = local_dir.relative_to(local_root)
              if str(rel) == '.':
                  return remote_root
              return '/' + rel.as_posix()

          def remote_size(remote_dir: str, filename: str):
              ftp.cwd(remote_dir)
              try:
                  ftp.voidcmd('TYPE I')
                  return ftp.size(filename)
              except ftplib.all_errors:
                  return None

          def upload_verified(local_path: Path, remote_dir: str, atomic=False):
              ensure_remote_dir(remote_dir)
              ftp.cwd(remote_dir)
              expected = local_path.stat().st_size
              if expected <= 0:
                  raise RuntimeError(f'Refusing to deploy empty file: {local_path}')

              final_name = local_path.name
              upload_name = f'.{final_name}.uploading' if atomic else final_name
              last_error = None

              for attempt in range(1, 4):
                  try:
                      ftp.cwd(remote_dir)
                      with local_path.open('rb') as fh:
                          ftp.storbinary(f'STOR {upload_name}', fh, blocksize=1024 * 1024)

                      actual = remote_size(remote_dir, upload_name)
                      if actual != expected:
                          raise RuntimeError(f'{upload_name}: remote size {actual}, expected {expected}')

                      if atomic:
                          ftp.cwd(remote_dir)
                          try:
                              ftp.delete(final_name)
                          except ftplib.all_errors:
                              pass
                          ftp.rename(upload_name, final_name)
                          final_size = remote_size(remote_dir, final_name)
                          if final_size != expected:
                              raise RuntimeError(f'{final_name}: remote size after rename {final_size}, expected {expected}')

                      print(f'uploaded+verified {local_path} -> {remote_dir.rstrip("/") or "/"}/{final_name} ({expected} bytes)')
                      return
                  except Exception as exc:
                      last_error = exc
                      print(f'upload attempt {attempt}/3 failed for {local_path}: {exc}')
                      time.sleep(attempt * 2)

              raise RuntimeError(f'Upload failed after retries for {local_path}: {last_error}')

          entrypoints = {local_root / 'index.html', local_root / 'monia-test.html'}
          for root, dirs, files in os.walk(local_root):
              local_dir = Path(root)
              remote_dir = remote_dir_for(local_dir)
              for filename in files:
                  local_path = local_dir / filename
                  if local_path in entrypoints:
                      continue
                  upload_verified(local_path, remote_dir)

          # Publish HTML entrypoints last and atomically.
          for entrypoint in ('monia-test.html', 'index.html'):
              local_path = local_root / entrypoint
              if local_path.exists():
                  upload_verified(local_path, remote_root, atomic=True)

          expected_index = (local_root / 'index.html').stat().st_size
          live_index = remote_size(remote_root, 'index.html')
          if live_index != expected_index:
              raise RuntimeError(f'FINAL index verification failed: remote={live_index}, expected={expected_index}')

          print(f'Public-root index verified at {live_index} bytes.')
          ftp.quit()
          PY

      - name: Verify public site and entry assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://marion-lucas.marionbolomey.fr'
          html="$(curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 45 "$base/?deploy=${GITHUB_SHA}")"
          printf '%s' "$html" | grep -q '<title>Marion & Lucas</title>' || {
            echo 'ERROR: the public URL is not serving the freshly deployed Marion & Lucas index.'
            printf '%s\n' "$html" | head -c 1200
            exit 1
          }
          js="$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js"' | tail -1 | cut -d'"' -f2)"
          css="$(printf '%s' "$html" | grep -oE 'href="[^"]+\.css"' | tail -1 | cut -d'"' -f2)"
          test -n "$js"
          test -n "$css"
          case "$js" in http*) js_url="$js" ;; /*) js_url="$base$js" ;; *) js_url="$base/${js#./}" ;; esac
          case "$css" in http*) css_url="$css" ;; /*) css_url="$base$css" ;; *) css_url="$base/${css#./}" ;; esac
          echo "Public JS: $js_url"
          echo "Public CSS: $css_url"
          curl -fsSI --retry 3 --connect-timeout 15 --max-time 45 "$js_url" | head
          curl -fsSI --retry 3 --connect-timeout 15 --max-time 45 "$css_url" | head
