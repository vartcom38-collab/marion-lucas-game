name: Deploy to Infomaniak

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infomaniak-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Generate living world loops
        shell: bash
        run: |
          set -euo pipefail
          node tools/generate-living-loops.mjs
          find public/resources/living -maxdepth 1 -type f -name '*.mp4' -print || true

      - name: Build Vite application
        run: npm run build

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/monia-test.html
          test -d dist/assets
          test -d dist/resources
          test -f dist/api/monia-media-store.php
          test -f dist/api/monia-ai.php
          test -f dist/resources/living/home.mp4
          test -f dist/config/monia-visio-approved.json
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/config/monia-visio-approved.json','utf8'));if(m.status!=='locked'||!m.fallback)process.exit(1)"

      - name: Deploy dist to Infomaniak via FTPES
        env:
          INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
          INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
          INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ftplib
          import io
          import os
          from pathlib import Path

          host = os.environ['INFOMANIAK_FTP_HOST'].strip().replace('ftpes://', '').replace('ftps://', '').replace('ftp://', '').rstrip('/')
          user = os.environ['INFOMANIAK_FTP_USER'].strip()
          password = os.environ['INFOMANIAK_FTP_PASSWORD'].rstrip('\r\n')
          local_root = Path('dist')
          configured_root = '/sites/marion-lucas.marionbolomey.fr'

          ftp = ftplib.FTP_TLS(timeout=30)
          ftp.connect(host, 21)
          ftp.login(user, password)
          ftp.prot_p()
          ftp.set_pasv(True)

          def read_remote_text(path: str) -> str:
              buffer = io.BytesIO()
              try:
                  ftp.retrbinary(f'RETR {path}', buffer.write)
                  return buffer.getvalue().decode('utf-8', errors='ignore')
              except ftplib.all_errors:
                  return ''

          def dir_exists(path: str) -> bool:
              current = ftp.pwd()
              try:
                  ftp.cwd(path)
                  ftp.cwd(current)
                  return True
              except ftplib.all_errors:
                  try:
                      ftp.cwd(current)
                  except ftplib.all_errors:
                      pass
                  return False

          ftp.cwd('/')
          root_index = read_remote_text('/index.html').lower()
          root_markers = (
              'site est actuellement en construction',
              'bienvenue sur marion-lucas.marionbolomey.fr',
              'hébergé chez infomaniak',
              '<title>marion & lucas</title>',
              'marion-nimes.mp4',
              'lucas-intro.mp4',
          )

          if any(marker in root_index for marker in root_markers):
              remote_root = '/'
              print('Detected the live Marion & Lucas document root at FTP /; deploying directly to /.')
          elif not root_index and dir_exists(configured_root):
              remote_root = configured_root
              print(f'No index visible at FTP root; deploying to configured site directory: {remote_root}')
          else:
              remote_root = '/'
              print('Using FTP root as the public document root.')

          def ensure_remote_dir(path: str):
              parts = [p for p in path.split('/') if p]
              ftp.cwd('/')
              for part in parts:
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          def remote_dir_for(local_dir: Path) -> str:
              rel = local_dir.relative_to(local_root)
              if str(rel) == '.':
                  return remote_root
              if remote_root == '/':
                  return '/' + rel.as_posix()
              return remote_root.rstrip('/') + '/' + rel.as_posix()

          def upload_file(local_path: Path, remote_dir: str):
              ensure_remote_dir(remote_dir)
              ftp.cwd(remote_dir)
              with local_path.open('rb') as fh:
                  ftp.storbinary(f'STOR {local_path.name}', fh, blocksize=1024 * 1024)
              print(f'uploaded {local_path} -> {remote_dir.rstrip("/")}/{local_path.name}')

          ensure_remote_dir(remote_root)

          # Keep the currently working index live while every new hashed asset and
          # resource is uploaded. Old hashed assets stay present, so the old page
          # continues to work throughout the deployment.
          entrypoints = {local_root / 'index.html', local_root / 'monia-test.html'}
          for root, dirs, files in os.walk(local_root):
              local_dir = Path(root)
              remote_dir = remote_dir_for(local_dir)
              for filename in files:
                  local_path = local_dir / filename
                  if local_path in entrypoints:
                      continue
                  upload_file(local_path, remote_dir)

          # Publish HTML entrypoints only after their referenced assets exist.
          for entrypoint in ('monia-test.html', 'index.html'):
              local_path = local_root / entrypoint
              if local_path.exists():
                  upload_file(local_path, remote_root)

          ftp.quit()
          PY
