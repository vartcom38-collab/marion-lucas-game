name: MonIA Lucas Visio V10-A Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/monia_visio_v10a_preview.py"
      - ".github/workflows/monia-visio-v10a-preview.yml"

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check requests pillow gradio_client

      - name: Build MonIA visio preview with V10-A voice
        run: python -m scripts.monia_visio_v10a_preview --publish-candidate

      - name: Verify candidate publicly
        run: |
          python - <<'PY'
          import requests
          url = "https://marion-lucas.marionbolomey.fr/resources/monia/generated/visio-lucas-v10a-voice-preview-candidate.mp4"
          r = requests.get(url, timeout=60, headers={"Range":"bytes=0-127", "Cache-Control":"no-cache", "Accept":"video/*,*/*"})
          ok = r.status_code in (200,206) and len(r.content) >= 16 and (b"ftyp" in r.content[:64] or r.content.startswith(b"RIFF") or r.content.startswith(b"\x1aE\xdf\xa3"))
          print("candidate", url, "status", r.status_code, "bytes", len(r.content), "ok", ok)
          if not ok:
              raise SystemExit("V10-A visio preview public verification failed")
          PY

      - name: Candidate-only policy
        run: |
          echo "Candidate only: true"
          echo "Live manifest mutation: forbidden"
          echo "Source visual: approved-layout candidate V7"
          echo "Source voice: V10-A candidate"
          echo "Playback-rate warping: forbidden"
