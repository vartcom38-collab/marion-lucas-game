name: Analyze Dominic 011 Frames

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-dominic-011.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Extract review frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-011
          SRC='public/resources/monia/candidates/dominic-seated-monia-library-011/shot-01.mp4'
          ffmpeg -y -v error -i "$SRC" -vf "select='eq(n,0)+eq(n,4)+eq(n,8)+eq(n,12)+eq(n,17)'" -vsync 0 review-011/frame-%02d.jpg
          ffmpeg -y -v error -i "$SRC" -vf "fps=9,scale=256:-1,tile=6x3" -frames:v 1 review-011/contact-sheet.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: dominic-011-review
          path: review-011/
          if-no-files-found: error
