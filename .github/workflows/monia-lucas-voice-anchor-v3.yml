name: MonIA Lucas Fixed Voice Anchor V3

on:
  push:
    paths:
      - 'scripts/monia_lucas_voice_anchor_v3_measured.py'
      - '.github/workflows/monia-lucas-voice-anchor-v3.yml'
  workflow_dispatch:

jobs:
  generate-anchor-v3:
    runs-on: ubuntu-24.04
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow numpy
      - name: Generate one measured Lucas anchor V3 candidate
        run: python -m scripts.monia_lucas_voice_anchor_v3_measured --publish-candidate
      - name: Verify public anchor V3 candidate
        run: |
          python - <<'PY'
          import requests
          url='https://marion-lucas.marionbolomey.fr/resources/monia/generated/lucas-voice-anchor-v3-measured-video-style-fr-candidate.wav'
          r=requests.get(url,timeout=60,headers={'Cache-Control':'no-cache'})
          r.raise_for_status()
          assert len(r.content)>4096,len(r.content)
          assert r.content[:4]==b'RIFF',r.content[:12]
          print('verified',url,len(r.content))
          PY
      - name: Candidate-only policy
        run: |
          echo "Single fixed synthetic Lucas V3 anchor candidate."
          echo "Reference video informed broad measured style traits only; no biometric cloning."
          echo "No visio/runtime mutation and no auto-promotion."
