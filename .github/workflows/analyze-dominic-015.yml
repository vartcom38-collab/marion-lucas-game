name: Analyze Dominic 015 Frames

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-dominic-015.yml'

permissions:
  contents: read

jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Extract review frames
        shell: bash
        run: |
          set -euo pipefail
          SRC="public/resources/monia/candidates/dominic-seated-monia-library-015/shot-01.mp4"
          test -f "$SRC"
          mkdir -p review-015
          for n in 0 5 10 16 22 27 32; do
            ffmpeg -y -v error -i "$SRC" -vf "select=eq(n\,$n)" -vsync vfr -frames:v 1 "review-015/frame-$(printf '%02d' "$n").jpg"
          done
          ffmpeg -y -v error -i "$SRC" -vf "fps=8,scale=256:-1,tile=4x4" -frames:v 1 review-015/contact-sheet.jpg
          cp "public/resources/monia/candidates/dominic-seated-monia-library-015/scene-first-frame.jpg" review-015/scene-first-frame.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: dominic-015-review
          path: review-015
          if-no-files-found: error
