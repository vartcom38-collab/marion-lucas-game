name: MonIA Lucas Surprise Visio V5

on:
  push:
    branches: [main]
    paths:
      - 'scripts/monia_visio_surprise_v2_pack.py'
      - 'config/lucas-voice-strategy.json'
      - 'config/lucas-reference-bank.json'
      - 'config/monia-generation-orchestrator.json'
      - '.github/workflows/monia-visio-surprise-v2.yml'
  workflow_dispatch:

jobs:
  generate-visio-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MonIA generation dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Assert official Lucas voice is V16
        run: |
          python - <<'PY'
          import json
          cfg=json.load(open('config/lucas-voice-strategy.json',encoding='utf-8'))
          ref=cfg['approved_reference']
          assert cfg['status']=='approved-v16-voice-and-flow', cfg['status']
          assert ref['status']=='approved-by-user', ref['status']
          assert ref['candidate']=='lucas-voice-v16-b-smoother-flow-fr-candidate.wav', ref['candidate']
          print('Lucas official voice locked:', ref['candidate'])
          PY

      - name: Generate full MonIA surprise visio candidate
        run: python -m scripts.monia_visio_surprise_v2_pack --state all --publish-candidate

      - name: Verify public V5 candidate set
        run: |
          python - <<'PY'
          import requests
          base='https://marion-lucas.marionbolomey.fr/resources/monia/generated/'
          files=[
            'visio-lucas-surprise-v5-monia-listening-candidate.mp4',
            'visio-lucas-surprise-v5-monia-speaking-v16-candidate.mp4',
            'visio-lucas-surprise-v5-monia-reaction-candidate.mp4',
          ]
          for name in files:
              url=base+name
              r=requests.get(url,timeout=90,headers={'Cache-Control':'no-cache'})
              r.raise_for_status()
              assert len(r.content)>10000,(name,len(r.content))
              assert b'ftyp' in r.content[:64],(name,r.content[:64])
              print('verified',url,len(r.content))
          PY

      - name: Candidate policy
        run: |
          echo "MonIA owns the full surprise-visio decision path."
          echo "Lucas speaking uses the approved V16 audio only."
          echo "The speaking visual is generated around the exact V16 utterance and measured V16 duration."
          echo "The viewpoint is Lucas's smartphone front camera; the phone must remain invisible."
          echo "Duration-level A/V validation is mandatory."
          echo "Phoneme-level lip-sync is NOT claimed by this workflow and still requires explicit validation before live promotion."
          echo "No automatic promotion to canonical reference banks."
