name: MonIA Lucas Visio Layout Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/monia-visio-layout-test.yml"
      - "scripts/monia_visio_layout_test.py"
      - "scripts/monia_video_engine.py"
      - "resources/monia/canon/lucas/visio-layout-parts/**"

permissions:
  contents: read

jobs:
  generate-layout-speaking-fr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install MonIA video dependencies
        run: python -m pip install --disable-pip-version-check gradio_client pillow requests

      - name: Reconstruct and validate layout reference
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image

          root = Path('resources/monia/canon/lucas/visio-layout-parts')
          prefix_b64 = ''.join((root / f'part-{i:02d}.txt').read_text().strip() for i in range(4))
          prefix = base64.b64decode(prefix_b64)
          suffix = (root / 'part-04.bin').read_bytes() + (root / 'part-05.bin').read_bytes()
          p = Path('resources/monia/canon/lucas/visio-layout-reference.jpg')
          p.write_bytes(prefix + suffix)
          im = Image.open(p); im.load()
          if im.width < 300 or im.height < 500:
              raise SystemExit(f'layout reference too small: {im.width}x{im.height}')
          print(f'layout reference valid: {im.width}x{im.height}, {p.stat().st_size} bytes')
          PY

      - name: Generate layout candidate only
        run: python -m scripts.monia_visio_layout_test --publish-candidate

      - name: Verify candidate publicly
        run: |
          python - <<'PY'
          import os, requests
          url=f'https://marion-lucas.marionbolomey.fr/resources/monia/generated/visio-lucas-speaking-fr-layout-v5-candidate.mp4?run={os.environ["GITHUB_RUN_ID"]}'
          r=requests.get(url,timeout=30,headers={'Range':'bytes=0-63','Cache-Control':'no-cache','Accept':'video/*,*/*'})
          ok=r.status_code in (200,206) and len(r.content)>=16 and (b'ftyp' in r.content[:32] or r.content.startswith(b'RIFF') or r.content.startswith(b'\x1aE\xdf\xa3'))
          print(f'candidate={url} verified={ok} status={r.status_code} bytes={len(r.content)}')
          if not ok:
              raise SystemExit('MonIA V5 layout candidate public verification failed')
          PY

      - name: Candidate-only policy
        run: |
          echo "Candidate only: true"
          echo "Narrative authority: false"
          echo "Live manifest mutation: forbidden"
          echo "Purpose: visual validation of exact visio composition, warm gaze and natural everyday French delivery"
