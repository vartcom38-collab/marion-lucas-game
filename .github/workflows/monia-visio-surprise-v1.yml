name: MonIA Lucas Surprise Visio V1

on:
  push:
    paths:
      - 'scripts/monia_visio_surprise_v1.py'
      - '.github/workflows/monia-visio-surprise-v1.yml'
  workflow_dispatch:

jobs:
  generate-surprise-visio:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate MonIA surprise visio candidate with Lucas V4 voice
        run: python -m scripts.monia_visio_surprise_v1 --publish-candidate
      - name: Verify public surprise visio candidate
        run: |
          python - <<'PY'
          import requests
          url='https://marion-lucas.marionbolomey.fr/resources/monia/generated/visio-lucas-surprise-v1-v4voice-candidate.mp4'
          r=requests.get(url,timeout=90,headers={'Cache-Control':'no-cache'})
          r.raise_for_status()
          assert len(r.content)>10000,len(r.content)
          assert b'ftyp' in r.content[:64],r.content[:64]
          print('verified',url,len(r.content))
          PY
      - name: Candidate-only policy
        run: |
          echo "MonIA-only Lucas surprise visio candidate."
          echo "Uses the V4 synthetic French voice at native speed."
          echo "No runtime mutation, no auto-promotion, no playback-rate warping."
