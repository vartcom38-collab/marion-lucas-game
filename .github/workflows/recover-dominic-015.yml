name: Recover Dominic 015 Output

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-dominic-015.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Recover completed Kaggle output with retries
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="marionbolomey/monia-headless-worker"
          OUT="/tmp/monia-kaggle-output"
          rm -rf "$OUT"; mkdir -p "$OUT"
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "Download attempt $attempt/5"
            rm -rf "$OUT"; mkdir -p "$OUT"
            if kaggle kernels output "$KERNEL" -p "$OUT" -o; then
              ok=1
              break
            fi
            sleep $((attempt*8))
          done
          test "$ok" = "1"
          test -f "$OUT/job.json"
          ACTUAL="$(python -c "import json; print(json.load(open('$OUT/job.json')).get('id',''))")"
          echo "Recovered job: $ACTUAL"
          test "$ACTUAL" = "dominic-seated-monia-library-015"

          SRC="$OUT/monia-studio/$ACTUAL"
          DEST="public/resources/monia/candidates/$ACTUAL"
          test -f "$SRC/result.json"
          test -f "$SRC/shot-01.mp4"
          mkdir -p "$DEST"
          cp "$SRC/result.json" "$DEST/result.json"
          cp "$SRC/shot-01.mp4" "$DEST/shot-01.mp4"
          [ ! -f "$SRC/identity-lock-report.json" ] || cp "$SRC/identity-lock-report.json" "$DEST/identity-lock-report.json"
          [ ! -f "$SRC/scene-first-frame.jpg" ] || cp "$SRC/scene-first-frame.jpg" "$DEST/scene-first-frame.jpg"

      - name: Persist recovered candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/resources/monia/candidates/dominic-seated-monia-library-015
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "MonIA recover candidate package dominic-seated-monia-library-015"
            git push
          fi
