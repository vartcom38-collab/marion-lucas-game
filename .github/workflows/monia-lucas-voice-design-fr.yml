name: MonIA Lucas Voice Design FR

on:
  push:
    branches: [main]
    paths:
      - "scripts/monia_lucas_voice_design_fr.py"
      - ".github/workflows/monia-lucas-voice-design-fr.yml"
  workflow_dispatch:

jobs:
  generate-lucas-voice-design-fr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and MonIA voice-design dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow

      - name: Generate three Lucas V14 timbre micro-candidates
        run: python -m scripts.monia_lucas_voice_design_fr --publish-candidate

      - name: Verify candidates publicly
        run: |
          python - <<'PY'
          import requests
          base = "https://marion-lucas.marionbolomey.fr/resources/monia/generated/"
          names = [
              "lucas-voice-v14-a-round-timbre-candidate.wav",
              "lucas-voice-v14-b-close-timbre-candidate.wav",
              "lucas-voice-v14-c-textured-timbre-candidate.wav",
          ]
          for name in names:
              url = base + name
              r = requests.get(url, timeout=60, headers={"Cache-Control":"no-cache"})
              r.raise_for_status()
              assert len(r.content) > 4096, (name, len(r.content))
              assert r.content[:4] == b"RIFF", (name, r.content[:12])
              print("verified", url, len(r.content))
          PY

      - name: Candidate-only policy
        run: |
          echo "V14 tests timbre only on one very short phrase."
          echo "V12 remains the best French-flow checkpoint; do not judge V14 for long-form flow."
          echo "No exact real-person voice cloning. No speed or pitch manipulation."
          echo "No live manifest mutation. Human listening approval required."
