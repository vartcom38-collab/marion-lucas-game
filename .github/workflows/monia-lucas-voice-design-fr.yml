name: MonIA Lucas Voice Design FR

on:
  push:
    branches: [main]
    paths:
      - "scripts/monia_lucas_voice_design_fr.py"
      - ".github/workflows/monia-lucas-voice-design-fr.yml"
  workflow_dispatch:

jobs:
  generate-lucas-voice-design-fr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MonIA voice-design dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow

      - name: Generate seductive native French Lucas voice candidates
        run: python -m scripts.monia_lucas_voice_design_fr --publish-candidate

      - name: Verify candidates publicly
        run: |
          python - <<'PY'
          import requests
          base = "https://marion-lucas.marionbolomey.fr/resources/monia/generated/"
          for key in ("a", "b", "c"):
              url = base + f"lucas-voice-v8-seductive-fr-{key}-candidate.wav"
              r = requests.get(url, timeout=60, headers={"Cache-Control":"no-cache"})
              r.raise_for_status()
              assert len(r.content) > 4096, (key, len(r.content))
              assert r.content[:4] == b"RIFF", (key, r.content[:12])
              print("verified", key, url, len(r.content))
          PY

      - name: Candidate-only policy
        run: |
          echo "Voice candidates only. No live manifest mutation."
          echo "Native French generation only; no English prosody transfer and no speech-to-speech translation."
          echo "Target: composed, warm, velvety, seductive Lucas presence without caricature."
