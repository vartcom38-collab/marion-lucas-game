name: MonIA Lucas Voice Design FR

on:
  push:
    branches: [main]
    paths:
      - "scripts/monia_lucas_voice_design_fr.py"
      - ".github/workflows/monia-lucas-voice-design-fr.yml"
  workflow_dispatch:

jobs:
  generate-lucas-voice-design-fr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MonIA voice-design dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow

      - name: Generate one soft-flow French Lucas candidate
        run: python -m scripts.monia_lucas_voice_design_fr --publish-candidate

      - name: Verify candidate publicly
        run: |
          python - <<'PY'
          import requests
          url = "https://marion-lucas.marionbolomey.fr/resources/monia/generated/lucas-voice-v11-soft-flow-fr-candidate.wav"
          r = requests.get(url, timeout=60, headers={"Cache-Control":"no-cache"})
          r.raise_for_status()
          assert len(r.content) > 4096, len(r.content)
          assert r.content[:4] == b"RIFF", r.content[:12]
          print("verified", url, len(r.content))
          PY

      - name: Candidate-only policy
        run: |
          echo "One diagnostic candidate only. No live manifest mutation."
          echo "Lucas uploaded clips guide broad conversational flow; approved soft rendering guides tone."
          echo "No exact real-person voice cloning."
          echo "Human listening approval required before any runtime use."
