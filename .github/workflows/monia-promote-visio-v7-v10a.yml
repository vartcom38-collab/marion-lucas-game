name: Promote validated Lucas V7 visio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/monia_promote_visio_v7_v10a.py"
      - ".github/workflows/monia-promote-visio-v7-v10a.yml"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install promotion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check requests
      - name: Promote exact validated V7 plus V10-A take
        run: python scripts/monia_promote_visio_v7_v10a.py
      - name: Verify approved asset publicly
        run: |
          python - <<'PY'
          import requests
          url='https://marion-lucas.marionbolomey.fr/resources/monia/approved/visio/lucas-v7-v10a-speaking-approved.mp4'
          r=requests.get(url,timeout=60,headers={'Range':'bytes=0-127','Cache-Control':'no-cache','Accept':'video/*,*/*'})
          ok=r.status_code in (200,206) and len(r.content)>=16 and b'ftyp' in r.content[:64]
          print(url,r.status_code,len(r.content),ok)
          if not ok: raise SystemExit('approved visio verification failed')
          PY
      - name: Approval policy
        run: |
          echo "Human validation received: true"
          echo "Source visual: exact validated V7 black-shirt visio"
          echo "Voice/timing: validated V10-A-timbre timing take"
          echo "Trailing filler removed only from final audio tail"
          echo "No mouth patch, no playback-rate warp, no identity regeneration"
