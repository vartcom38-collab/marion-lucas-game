name: MonIA Lucas V3

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/monia-lucas-v3.yml"
      - "scripts/monia_intro_worker.py"

permissions:
  contents: read

jobs:
  generate-lucas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check gradio_client pillow requests
      - name: Ensure Lucas canon is public on Infomaniak
        shell: bash
        run: |
          python - <<'PY'
          import ftplib, io, os, time
          import requests
          from PIL import Image

          PUBLIC_URL='https://marion-lucas.marionbolomey.fr/resources/monia/canon/lucas/reference.jpg'
          BOOTSTRAP_URL='https://pikaso.cdnpk.net/private/production/5364341239/3549261673.jpg?token=exp=1788998400~hmac=704a87649404f0b780d3618a1149ffd454a420ef53866062c8c76244f532e1c3'

          def valid(data):
              try:
                  if len(data) < 2048: return False
                  im=Image.open(io.BytesIO(data)); im.load()
                  return im.width >= 80 and im.height >= 100
              except Exception:
                  return False

          existing=requests.get(PUBLIC_URL,timeout=30,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
          if existing.ok and valid(existing.content):
              print(f'Lucas canon already public: {len(existing.content)} bytes')
              raise SystemExit(0)

          src=requests.get(BOOTSTRAP_URL,timeout=45)
          src.raise_for_status()
          if not valid(src.content): raise RuntimeError('Bootstrap image is invalid')

          host=os.environ['INFOMANIAK_FTP_HOST'].strip().replace('ftpes://','').replace('ftps://','').replace('ftp://','').rstrip('/')
          ftp=ftplib.FTP_TLS(timeout=45); ftp.connect(host,21)
          ftp.login(os.environ['INFOMANIAK_FTP_USER'].strip(),os.environ['INFOMANIAK_FTP_PASSWORD'].rstrip('\r\n'))
          ftp.prot_p(); ftp.set_pasv(True); ftp.cwd('/')

          def read_text(path):
              buf=io.BytesIO()
              try:
                  ftp.retrbinary(f'RETR {path}',buf.write)
                  return buf.getvalue().decode('utf-8',errors='ignore').lower()
              except ftplib.all_errors:
                  return ''

          def dir_exists(path):
              cur=ftp.pwd()
              try:
                  ftp.cwd(path); ftp.cwd(cur); return True
              except ftplib.all_errors:
                  try: ftp.cwd(cur)
                  except ftplib.all_errors: pass
                  return False

          root_index=read_text('/index.html')
          markers=('site est actuellement en construction','bienvenue sur marion-lucas.marionbolomey.fr','hébergé chez infomaniak','<title>marion & lucas</title>','marion-nimes.mp4','lucas-intro.mp4')
          configured='/sites/marion-lucas.marionbolomey.fr'
          if any(m in root_index for m in markers):
              root='/'
          elif not root_index and dir_exists(configured):
              root=configured
          else:
              root='/'
          print(f'Lucas canon live FTP root detected: {root}')

          parts=[p for p in ((root.rstrip('/') if root!='/' else '')+'/resources/monia/canon/lucas').split('/') if p]
          ftp.cwd('/')
          for part in parts:
              try: ftp.cwd(part)
              except ftplib.error_perm:
                  ftp.mkd(part); ftp.cwd(part)
          ftp.storbinary('STOR reference.jpg',io.BytesIO(src.content),blocksize=1024*1024)
          ftp.quit()
          print(f'Lucas canon uploaded: {len(src.content)} bytes')

          last=None
          for i in range(6):
              try:
                  r=requests.get(PUBLIC_URL+f'?bootstrap={int(time.time())}',timeout=30,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
                  if r.ok and valid(r.content):
                      print(f'Lucas canon publicVerification=true bytes={len(r.content)}')
                      break
                  last=f'HTTP {r.status_code} bytes={len(r.content)}'
              except Exception as exc: last=str(exc)
              time.sleep(3)
          else:
              raise RuntimeError(f'Lucas canon still not public after FTP upload: {last}')
          PY
      - name: Generate Lucas desktop candidate with strict identity lock
        shell: bash
        run: |
          cat > .monia_lucas_v3.py <<'PY'
          import io, json, multiprocessing as mp, os
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from PIL import Image
          from gradio_client import Client, handle_file
          import scripts.monia_intro_worker as worker

          CANON_URL='https://marion-lucas.marionbolomey.fr/resources/monia/canon/lucas/reference.jpg'
          source=Path('/tmp/lucas-source.png')
          target=Path('.monia-intro-worker/intro-lucas-candidate-desktop.mp4')
          target.parent.mkdir(parents=True,exist_ok=True)
          prompt=(
              'Photorealistic live-action desktop-game cinematic shot of Lucas. The supplied reference image is the absolute identity authority. '
              'Do not redesign, beautify, reinterpret or substitute his face. Keep the same facial geometry, eye spacing, nose, mouth, jaw, cheekbones, hairline, dark swept-back hair, light eyes, short stubble, tanned olive skin, neck tattoos and upper-chest tattoos. '
              'Lucas must look like the same man in the reference at every frame. Horizontal 16:9 computer-screen composition, chest-up framing, Lucas alone, realistic neutral interior, soft natural morning daylight. '
              'Motion must be extremely restrained to protect identity: natural breathing, one or two realistic blinks, a tiny eye shift, a very small controlled head inclination, and at most a restrained asymmetric half-smile. Closed mouth, no speaking. '
              'No woman, no second person, no extra hands, no text, no subtitles, no watermark, no UI, no morphing, no face drift, no eye-color drift, no tattoo drift, no hairstyle drift, no age change, no glamour retouching, no generic-model face, no exaggerated expression, no sudden movement.'
          )
          negative=(
              'different man, changed identity, generic male model, beauty filter, altered jaw, altered eyes, altered nose, altered mouth, altered hairline, altered tattoos, '
              'cartoon, illustration, low quality, distorted face, deformed face, talking, open mouth, woman, second person, extra person, hands from another person, watermark, text, subtitles, title, UI, jitter, morphing, identity drift'
          )

          r=requests.get(CANON_URL,timeout=30,headers={'Cache-Control':'no-cache'}); r.raise_for_status()
          im=Image.open(io.BytesIO(r.content)).convert('RGB'); im.load()
          ratio=768/1024; sr=im.width/im.height
          if sr>ratio:
              nw=round(im.height*ratio); left=max(0,(im.width-nw)//2); im=im.crop((left,0,left+nw,im.height))
          elif sr<ratio:
              nh=round(im.width/ratio); top=max(0,(im.height-nh)//2); im=im.crop((0,top,im.width,top+nh))
          im.resize((768,1024),Image.Resampling.LANCZOS).save(source,'PNG',optimize=True)
          print(f'Lucas exact canon loaded from Infomaniak -> {source.stat().st_size} bytes',flush=True)

          def run_ltx_landscape():
              print(f'MONIA provider={worker.LTX_LABEL} upload landscape',flush=True)
              session=requests.Session(); session.headers.update(worker.hf_headers())
              with source.open('rb') as fh:
                  upload=session.post(f'{worker.LTX_SPACE}/gradio_api/upload',files={'files':(source.name,fh,'image/png')},timeout=60)
              upload.raise_for_status(); data=upload.json()
              uploaded=data[0] if isinstance(data,list) else (data.get('files') or [data.get('path')])[0]
              if not uploaded: raise RuntimeError('LTX upload accepted but reference missing')
              payload={
                  'task_type':'i2v','prompt':prompt,'start_image':uploaded,'negative_prompt':negative,
                  'resolution':'544p','aspect_ratio':'16:9 (Landscape)','width':960,'height':544,
                  'duration':3,'fps':'24fps','seed':-1,'zero_gpu_duration':55,
                  'use_spatial_upscaler':False,'use_temporal_upscaler':False,'async_execution':False,
              }
              submit=session.post(f'{worker.LTX_SPACE}/gradio_api/call/run',json={'data':[json.dumps(payload)]},timeout=60)
              submit.raise_for_status(); event_id=submit.json().get('event_id')
              if not event_id: raise RuntimeError('LTX GPU job not created')
              response=session.get(f'{worker.LTX_SPACE}/gradio_api/call/run/{quote(str(event_id),safe="")}',headers={'Accept':'text/event-stream',**worker.hf_headers()},timeout=worker.LTX_TIMEOUT_SECONDS)
              response.raise_for_status()
              for block in response.text.split('\n\n'):
                  event=data_line=None
                  for line in block.splitlines():
                      if line.startswith('event:'): event=line.split(':',1)[1].strip()
                      elif line.startswith('data:'): data_line=line.split(':',1)[1].strip()
                  if event=='error': raise RuntimeError(data_line or 'LTX rejected generation')
                  if event=='complete' and data_line:
                      candidates=worker.deep_candidates(json.loads(data_line))
                      errors=[]
                      for candidate in candidates:
                          try:
                              worker.materialize(candidate,target,worker.LTX_SPACE,session=session)
                              if worker.looks_like_video(target): return
                          except Exception as exc: errors.append(str(exc))
                      raise RuntimeError('No LTX video recovered: '+' | '.join(errors[-3:]))
              raise RuntimeError('Incomplete LTX response')

          def wan_child(space,label,q):
              try:
                  token=os.environ.get('HF_TOKEN','').strip() or None
                  client=Client(space,token=token,verbose=False)
                  result=client.predict(prompt,handle_file(str(source)),1024,576,33,20,5,-1,api_name=worker.WAN_API_NAME)
                  errors=[]
                  for candidate in worker.deep_candidates(result):
                      try:
                          worker.materialize(candidate,target)
                          if worker.looks_like_video(target): q.put((True,'')); return
                      except Exception as exc: errors.append(str(exc))
                  raise RuntimeError('No landscape Wan video recovered: '+' | '.join(errors[-3:]))
              except Exception as exc: q.put((False,str(exc)))

          def run_wan_landscape(space,label):
              ctx=mp.get_context('fork'); q=ctx.Queue(); p=ctx.Process(target=wan_child,args=(space,label,q)); p.start(); p.join(120)
              if p.is_alive(): p.terminate(); p.join(5); raise TimeoutError(f'{label} timeout')
              if q.empty(): raise RuntimeError(f'{label} ended without result code={p.exitcode}')
              ok,detail=q.get()
              if not ok: raise RuntimeError(detail)

          errors=[]
          try:
              run_ltx_landscape(); print(f'Lucas desktop candidate generated with {worker.LTX_LABEL}: {target.stat().st_size} bytes',flush=True)
          except Exception as exc:
              target.unlink(missing_ok=True); errors.append(f'{worker.LTX_LABEL}: {exc}'); print(f'LTX unavailable; landscape Wan fallback: {exc}',flush=True)
              for space,label in worker.WAN_PROVIDERS:
                  try:
                      run_wan_landscape(space,label); print(f'Lucas desktop candidate generated with {label}: {target.stat().st_size} bytes',flush=True); break
                  except Exception as wexc:
                      target.unlink(missing_ok=True); errors.append(f'{label}: {wexc}'); print(f'Wan fallback failed {label}: {wexc}',flush=True)
              else: raise RuntimeError(' | '.join(errors))

          if not worker.looks_like_video(target): raise RuntimeError('Generated Lucas candidate is not a valid video')
          ftp=worker.ftp_connect()
          try:
              root=worker.remote_root(ftp); url=worker.upload_file(ftp,root,target,target.name)
              print(f'Lucas candidate uploaded to Infomaniak: {url}',flush=True)
          finally:
              try: ftp.quit()
              except Exception: pass
          PY
          python .monia_lucas_v3.py
      - name: Verify Lucas candidate publicly
        run: |
          python - <<'PY'
          import requests
          url='https://marion-lucas.marionbolomey.fr/resources/monia/generated/intro-lucas-candidate-desktop.mp4?run=${{ github.run_id }}'
          r=requests.get(url,timeout=30,headers={'Range':'bytes=0-63','Cache-Control':'no-cache','Accept':'video/*,*/*'})
          ok=r.status_code in (200,206) and len(r.content)>=16 and (b'ftyp' in r.content[:32] or r.content.startswith(b'RIFF') or r.content.startswith(b'\x1aE\xdf\xa3'))
          print(f'candidatePublicVerification={ok} status={r.status_code} bytes={len(r.content)}')
          if not ok: raise SystemExit('Lucas candidate public video verification failed')
          PY
