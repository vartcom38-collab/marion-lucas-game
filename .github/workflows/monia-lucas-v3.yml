name: MonIA Lucas V3

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/monia-lucas-v3.yml"
      - "scripts/monia_video_engine.py"
      - "scripts/monia_lucas_canon_from_video.py"
      - "scripts/monia_intro_worker.py"

permissions:
  contents: read

jobs:
  generate-lucas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free MonIA dependencies
        run: python -m pip install --disable-pip-version-check gradio_client pillow requests
      - name: Refresh Lucas canon from private source video when available
        run: |
          python - <<'PY'
          import subprocess
          try:
              subprocess.run(['python', 'scripts/monia_lucas_canon_from_video.py'], check=True)
              print('Lucas canon refreshed directly from private source video.')
          except subprocess.CalledProcessError as exc:
              print(f'No usable private source video yet; keeping existing canon. exit={exc.returncode}')
          PY
      - name: Validate Lucas canon
        run: |
          python - <<'PY'
          import io
          import requests
          from PIL import Image

          url='https://marion-lucas.marionbolomey.fr/resources/monia/canon/lucas/reference.jpg'
          r=requests.get(url, timeout=30, headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
          r.raise_for_status()
          if len(r.content) < 2048:
              raise SystemExit('Lucas canon is missing or too small')
          im=Image.open(io.BytesIO(r.content)); im.load()
          print(f'Lucas canon valid: {im.width}x{im.height}, {len(r.content)} bytes')
          PY
      - name: Generate Lucas with MonIA zero-cost engine
        run: python scripts/monia_video_engine.py --character lucas --publish-candidate
      - name: Verify Lucas candidate publicly
        run: |
          python - <<'PY'
          import requests
          url='https://marion-lucas.marionbolomey.fr/resources/monia/generated/intro-lucas-candidate-desktop.mp4?run=${{ github.run_id }}'
          r=requests.get(url, timeout=30, headers={'Range':'bytes=0-63','Cache-Control':'no-cache','Accept':'video/*,*/*'})
          ok=r.status_code in (200,206) and len(r.content)>=16 and (b'ftyp' in r.content[:32] or r.content.startswith(b'RIFF') or r.content.startswith(b'\x1aE\xdf\xa3'))
          print(f'candidatePublicVerification={ok} status={r.status_code} bytes={len(r.content)}')
          if not ok:
              raise SystemExit('Lucas candidate public video verification failed')
          PY
