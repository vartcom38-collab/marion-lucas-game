name: MonIA Video V2 — Kaggle isolated

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: "V2 job JSON path"
        required: false
        default: ".monia-render-queue-v2/lucas-motion-proof-v1.json"

permissions:
  contents: write

jobs:
  render-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v5
        with:
          ref: monia-video-v2

      - name: Build isolated Kaggle bundle
        shell: bash
        run: |
          set -euo pipefail
          JOB_PATH="${{ inputs.job_path }}"
          test -f "$JOB_PATH"
          mkdir -p .kaggle-v2
          cp kaggle/monia-video-v2/monia_video_v2.py .kaggle-v2/monia_video_v2.py
          cp kaggle/monia-video-v2/kernel-metadata.json .kaggle-v2/kernel-metadata.json
          cp "$JOB_PATH" .kaggle-v2/job-v2.json

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Validate Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          kaggle config view >/dev/null

      - name: Submit V2 worker
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels push -p .kaggle-v2

      - name: Wait for V2 worker
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="marionbolomey/monia-video-v2-worker"
          for attempt in $(seq 1 70); do
            STATUS="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "[$attempt/70] $STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|completed'; then exit 0; fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancelled|canceled'; then
              kaggle kernels logs "$KERNEL" || true
              exit 1
            fi
            sleep 60
          done
          exit 1

      - name: Download V2 output
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/monia-v2-output
          rm -rf "$OUT"
          mkdir -p "$OUT"
          kaggle kernels output marionbolomey/monia-video-v2-worker -p "$OUT" -o

          JOB_ID="$(python - <<'PY'
          import json
          print(json.load(open('.kaggle-v2/job-v2.json'))['id'])
          PY
          )"
          SRC="$OUT/monia-video-v2/$JOB_ID"
          test -f "$SRC/result.json"
          test -f "$SRC/candidate-01.mp4"

          DEST="public/resources/monia-v2/candidates/$JOB_ID"
          mkdir -p "$DEST"
          cp "$SRC/result.json" "$DEST/result.json"
          cp "$SRC/job.json" "$DEST/job.json"
          cp "$SRC/candidate-01.mp4" "$DEST/candidate-01.mp4"

      - name: Validate isolation flags
        shell: bash
        run: |
          python - <<'PY'
          import glob, json
          files=glob.glob('public/resources/monia-v2/candidates/*/result.json')
          assert files
          data=json.load(open(files[-1]))
          assert data['generator']=='monia-video-v2'
          assert data['candidateOnly'] is True
          assert data['narrativeAuthority'] is False
          assert data['publishToGame'] is False
          print('V2 isolation validated:', data['jobId'])
          PY

      - name: Commit V2 candidate to V2 branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/resources/monia-v2/candidates
          if git diff --cached --quiet; then
            echo "No V2 output change."
          else
            git commit -m "MonIA Video V2 candidate"
            git push origin HEAD:monia-video-v2
          fi

      - name: Safety note
        run: echo "V2 candidate generated in isolation. Legacy generator and live game manifests were not modified."
