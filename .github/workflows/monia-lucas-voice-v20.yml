name: MonIA Lucas V20 Clean Natural Voice

on:
  push:
    branches: [main]
    paths:
      - "scripts/monia_lucas_voice_v20_clean_reference.py"
      - ".github/workflows/monia-lucas-voice-v20.yml"
  workflow_dispatch:

jobs:
  generate-v20:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate V20 clean natural voice candidates
        run: python -m scripts.monia_lucas_voice_v20_clean_reference --publish-candidate
      - name: Verify public V20 candidates
        run: |
          python - <<'PY'
          import requests
          base='https://marion-lucas.marionbolomey.fr/resources/monia/generated/'
          for key in ('a','b','c'):
              url=base+f'lucas-voice-v20-{key}-clean-natural-fr-candidate.wav'
              r=requests.get(url,timeout=60,headers={'Cache-Control':'no-cache'})
              r.raise_for_status()
              assert len(r.content)>4096,(key,len(r.content))
              assert r.content[:4]==b'RIFF',(key,r.content[:12])
              print('verified',key,url,len(r.content))
          PY
      - name: Candidate-only policy
        run: |
          echo "V20 is a fresh synthetic voice search using broad style qualities from user-provided Lucas references."
          echo "No real-person biometric voice cloning."
          echo "No V16/V17/V18/V19 timbre target."
          echo "No live visio/runtime mutation. No auto-promotion."
