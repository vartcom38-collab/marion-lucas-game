name: MonIA Lucas Voice Native FR

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/monia-lucas-voice-native-fr.yml"
      - "scripts/monia_lucas_voice_native_fr.py"
      - "scripts/monia_video_engine.py"

permissions:
  contents: read

jobs:
  generate-lucas-native-fr-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install MonIA native French voice dependencies
        run: python -m pip install --disable-pip-version-check gradio_client requests pillow

      - name: Generate fluid French Lucas candidate
        run: python -m scripts.monia_lucas_voice_native_fr --publish-candidate

      - name: Verify candidate publicly
        run: |
          python - <<'PY'
          import requests
          url='https://marion-lucas.marionbolomey.fr/resources/monia/generated/lucas-voice-v4-french-fluid-candidate.wav'
          r=requests.get(url,timeout=30,headers={'Range':'bytes=0-127','Cache-Control':'no-cache','Accept':'audio/*,*/*'})
          ok=r.status_code in (200,206) and len(r.content)>=44 and r.content.startswith(b'RIFF')
          print(f'candidate={url} verified={ok} status={r.status_code} bytes={len(r.content)}')
          if not ok:
              raise SystemExit('MonIA Lucas fluid French candidate public verification failed')
          PY

      - name: Candidate-only policy
        run: |
          echo "Candidate only: true"
          echo "Narrative authority: false"
          echo "Live manifest mutation: forbidden"
          echo "French source: conversational native French donor"
          echo "Timbre target: Lucas V3 speaking reference"
          echo "Seed-VC convert_style: false (do not import English accent/style)"
