name: Analyze Dominic 014 Frames

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-dominic-014.yml'

permissions:
  contents: read

jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Extract review frames
        shell: bash
        run: |
          set -euo pipefail
          SRC="public/resources/monia/candidates/dominic-seated-monia-library-014/shot-01.mp4"
          test -f "$SRC"
          mkdir -p review-014
          for n in 0 8 16 24 32 40 48; do
            ffmpeg -y -v error -i "$SRC" -vf "select=eq(n\,$n)" -vsync vfr -frames:v 1 "review-014/frame-$(printf '%02d' "$n").jpg"
          done
          ffmpeg -y -v error -i "$SRC" -vf "fps=8,scale=256:-1,tile=4x4" -frames:v 1 review-014/contact-sheet.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: dominic-014-review
          path: review-014
          if-no-files-found: error
