name: MonIA Lucas Visio V10-A Direct Speaking

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/monia_visio_v10a_direct.py"
      - ".github/workflows/monia-visio-v10a-direct.yml"

permissions:
  contents: read

jobs:
  build-direct-speaking:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MonIA direct-speaking dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check requests pillow gradio_client

      - name: Generate true visio feed and preserve native lip timing with V10-A timbre
        run: python -m scripts.monia_visio_v10a_direct --publish-candidate

      - name: Verify candidate publicly
        run: |
          python - <<'PY'
          import requests
          url = "https://marion-lucas.marionbolomey.fr/resources/monia/generated/visio-lucas-v10a-direct-speaking-candidate.mp4"
          r = requests.get(url, timeout=60, headers={"Range":"bytes=0-127", "Cache-Control":"no-cache", "Accept":"video/*,*/*"})
          ok = r.status_code in (200,206) and len(r.content) >= 16 and (b"ftyp" in r.content[:64] or r.content.startswith(b"RIFF") or r.content.startswith(b"\x1aE\xdf\xa3"))
          print("candidate", url, "status", r.status_code, "bytes", len(r.content), "ok", ok)
          if not ok:
              raise SystemExit("V10-A direct-speaking visio candidate public verification failed")
          PY

      - name: Candidate-only policy
        run: |
          echo "Candidate only: true"
          echo "Live manifest mutation: forbidden"
          echo "Media is raw Lucas remote-camera feed only; validated visio UI stays runtime-side"
          echo "Generation method: original MonIA native speaking video generation"
          echo "Voice target: V10-A timbre"
          echo "Speech timing: native generated audio preserved through timbre-only conversion"
          echo "Post lip replacement: forbidden"
          echo "Playback-rate warping: forbidden"
