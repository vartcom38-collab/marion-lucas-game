name: MonIA Lucas Human Prosody FR

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "HTTPS URL of a natural French performance of the exact target line"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-human-prosody-french-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and MonIA voice dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow

      - name: Download natural French performance
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          import requests

          url = os.environ['SOURCE_URL'].strip()
          parsed = urlparse(url)
          if parsed.scheme != 'https' or not parsed.netloc:
              raise SystemExit('Only HTTPS source URLs are accepted')
          r = requests.get(url, timeout=60, headers={'Cache-Control':'no-cache'})
          r.raise_for_status()
          if len(r.content) < 4096 or len(r.content) > 24 * 1024 * 1024:
              raise SystemExit(f'Invalid source size: {len(r.content)}')
          open('/tmp/lucas-fr-human-prosody-source','wb').write(r.content)
          print('downloaded', len(r.content), 'bytes')
          PY

      - name: Generate one candidate preserving human French prosody
        run: |
          python -m scripts.monia_lucas_human_prosody_fr \
            /tmp/lucas-fr-human-prosody-source \
            --publish-candidate

      - name: Verify candidate publicly
        run: |
          python - <<'PY'
          import requests
          url = "https://marion-lucas.marionbolomey.fr/resources/monia/generated/lucas-human-prosody-fr-candidate.wav"
          r = requests.get(url, timeout=60, headers={"Cache-Control":"no-cache"})
          r.raise_for_status()
          assert len(r.content) > 4096, len(r.content)
          assert r.content[:4] == b"RIFF", r.content[:12]
          print('verified', url, len(r.content))
          PY

      - name: Candidate-only policy
        run: |
          echo "Human performance supplies timing/prosody only."
          echo "User timbre and speaker identity are not a Lucas target."
          echo "Lucas target timbre is a distinct synthetic design built from broad qualities only."
          echo "No speed change, no pitch forcing, no word stitching, no syllable retiming."
          echo "No live manifest mutation. Human approval required."
