          fetch 'valencia-flat-view' 'https://pikaso.cdnpk.net/private/production/5434279048/3583737125.png?token=exp=1789516800~hmac=fdcfaf170b33e2d74cd5ccd9c797f20851833428d44d6f62326a9f5e4b0586b1'
          fetch 'basque-coast-exterior' 'https://pikaso.cdnpk.net/private/production/5434266645/3583730802.png?token=exp=1789516800~hmac=6b014ab92c053fe335ab56d93ed59990a68dda76c8275bbb52de307da6829d92'
