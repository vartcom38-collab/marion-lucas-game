name: Materialize property visuals

on:
  push:
    paths:
      - '.github/workflows/materialize-property-assets.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
      - name: Download and convert property visuals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/resources/properties .tmp-property-assets
          fetch() {
            key="$1"
            url="$2"
            src=".tmp-property-assets/${key}.png"
            curl -L --fail --retry 3 --retry-delay 2 "$url" -o "$src"
            cwebp -quiet -q 68 -resize 720 540 "$src" -o "public/resources/properties/${key}.webp"
          }
          fetch 'salamanca-finca-exterior' 'https://pikaso.cdnpk.net/private/production/5434282301/render.png?token=exp=1789516800~hmac=b31a775f9341e4ad2230df0cba231e090ec44c38c9a915356efebb8ec8b0ce23'
          fetch 'salamanca-finca-patio' 'https://pikaso.cdnpk.net/private/production/5434282459/render.png?token=exp=1789516800~hmac=80efbd640f783118328cfd1b30402934b6a2756f09f2a340ae95828bc1864ae1'
          fetch 'salamanca-finca-land' 'https://pikaso.cdnpk.net/private/production/5434281920/render.png?token=exp=1789516800~hmac=0d225b385f9bfef368d637bb8948314ca483564eb50d95490453f24cb3f9c0fd'
          fetch 'toledo-finca-exterior' 'https://pikaso.cdnpk.net/private/production/5434282910/render.png?token=exp=1789516800~hmac=f784a1f644943568b2804ec2cc23441da34148f2cdef05b6bb9d15c4d01e75b4'
          fetch 'toledo-finca-patio' 'https://pikaso.cdnpk.net/private/production/5434283146/render.png?token=exp=1789516800~hmac=fe4f9b8f6a2e57ffeaed184c53a1d40ba7fbb533546f7ed88085d8e5a2ba227a'
          fetch 'toledo-finca-olive' 'https://pikaso.cdnpk.net/private/production/5434282687/render.png?token=exp=1789516800~hmac=ee0d3f6c30e8c663f47d6a484aa8a4f63befd80204b1cfc243de592809a74e7e'
          fetch 'extremadura-estate-exterior' 'https://pikaso.cdnpk.net/private/production/5434283180/render.png?token=exp=1789516800~hmac=24b52e8f11195553bc570812063d7b655d5e22666c0b235e08186af35feed45a'
          fetch 'extremadura-estate-courtyard' 'https://pikaso.cdnpk.net/private/production/5434283791/render.png?token=exp=1789516800~hmac=cba36d1f73e0584a264e02296af42aa0df8a1022a56097f562416c919bba8cc0'
          fetch 'extremadura-estate-land' 'https://pikaso.cdnpk.net/private/production/5434283951/render.png?token=exp=1789516800~hmac=c5e479cfe897322e88340bf9db51392e558bc937257b13a12da05a168bdb788c'
          fetch 'jerez-finca-exterior' 'https://pikaso.cdnpk.net/private/production/5434275641/3583735375.png?token=exp=1789516800~hmac=a19a0102389c4e8e4d903d525ad0baf2037e5c474df55ac509111585a1256f9e'
          fetch 'jerez-finca-courtyard' 'https://pikaso.cdnpk.net/private/production/5434276142/3583735586.png?token=exp=1789516800~hmac=aa9c76917860861b7a9af6af5ed6a675f8a836a6a366e96d9c9a3a8718885aad'
