          fetch 'basque-coast-terrace' 'https://pikaso.cdnpk.net/private/production/5434268459/3583731750.png?token=exp=1789516800~hmac=7ed5d647dff679a737f1578ce5c9eaef9ebb49bdd9d8d4cdac386047fd12dc80'
          fetch 'soller-house-exterior' 'https://pikaso.cdnpk.net/private/production/5434268973/3583732034.png?token=exp=1789516800~hmac=c233dca780977d8deb7acd822c9507cf840b04b147af2306f6f859e085041272'
          fetch 'soller-house-terrace' 'https://pikaso.cdnpk.net/private/production/5434269750/3583732497.png?token=exp=1789516800~hmac=9f70a25430c5f763b7105d820cc72df4b5135ea61333ff0e72be72302b0f24ce'
          fetch 'soller-house-interior' 'https://pikaso.cdnpk.net/private/production/5434270072/3583732707.png?token=exp=1789516800~hmac=0efa6b45987b93a7bf2381f8a4d6b2200a42cf91f86fe3ff09ef7e1d1c1761cb'
          fetch 'girona-townhouse-exterior' 'https://pikaso.cdnpk.net/private/production/5434293663/render.png?token=exp=1789516800~hmac=606dedb0b9c206865877f779647659167f5238177eb0cdcab1fab2c43ad9080f'
          fetch 'girona-townhouse-interior' 'https://pikaso.cdnpk.net/private/production/5434274689/3583734862.png?token=exp=1789516800~hmac=5484d1f1b8b005d98013b24f3e3e2388d62e48f37b99904a46e7843febae65e6'
          fetch 'girona-townhouse-terrace' 'https://pikaso.cdnpk.net/private/production/5434275236/3583735169.png?token=exp=1789516800~hmac=ca59210ff8d0460270ce64bcb72aa857cbeb1e163144996a80f819c1cc3b49cc'
          rm -rf .tmp-property-assets
      - name: Commit property assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/resources/properties/*.webp
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'Add validated photorealistic property galleries'
          git push
