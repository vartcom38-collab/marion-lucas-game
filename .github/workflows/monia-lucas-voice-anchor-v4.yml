name: MonIA Lucas V4 Surprise Call Voice

on:
  push:
    paths:
      - 'scripts/monia_lucas_voice_anchor_v4_energy.py'
      - '.github/workflows/monia-lucas-voice-anchor-v4.yml'
  workflow_dispatch:

jobs:
  generate-v4-surprise-call:
    runs-on: ubuntu-24.04
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow numpy
      - name: Generate surprise call with fixed synthetic V4 identity
        run: python -m scripts.monia_lucas_voice_anchor_v4_energy --surprise-call --publish-candidate
      - name: Verify public V4 surprise-call candidate
        run: |
          python - <<'PY'
          import requests
          url='https://marion-lucas.marionbolomey.fr/resources/monia/generated/lucas-voice-v4-surprise-call-fr-candidate.wav'
          r=requests.get(url,timeout=60,headers={'Cache-Control':'no-cache'})
          r.raise_for_status()
          assert len(r.content)>4096,len(r.content)
          assert r.content[:4]==b'RIFF',r.content[:12]
          print('verified',url,len(r.content))
          PY
      - name: Candidate-only policy
        run: |
          echo "Fixed synthetic Lucas V4 identity, new French surprise-call line."
          echo "No real-person voice cloning."
          echo "No official runtime mutation and no auto-promotion."
