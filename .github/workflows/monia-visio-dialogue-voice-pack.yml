name: MonIA Lucas Visio Dialogue Voice Pack

on:
  push:
    branches: [main]
    paths:
      - "scripts/monia_visio_dialogue_voice_pack.py"
      - ".github/workflows/monia-visio-dialogue-voice-pack.yml"
  workflow_dispatch:

jobs:
  generate-dialogue-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate V18 as one continuous V16 synthetic Lucas session
        run: python -m scripts.monia_visio_dialogue_voice_pack
      - name: Verify public V18 dialogue audio
        run: |
          python - <<'PY'
          import requests
          base='https://marion-lucas.marionbolomey.fr/resources/monia/generated/'
          for key in ('opening','calm','warm','busy','tease','miss','end'):
              url=base+f'lucas-visio-dialogue-v18-{key}-candidate.wav'
              r=requests.get(url,timeout=60,headers={'Cache-Control':'no-cache'})
              r.raise_for_status()
              assert len(r.content)>4096,(key,len(r.content))
              assert r.content[:4]==b'RIFF',(key,r.content[:12])
              print('verified',key,url,len(r.content))
          PY
      - name: Candidate-only policy
        run: |
          echo "V18 uses one continuous Qwen3-TTS synthetic-to-synthetic session from the approved V16 Lucas voice."
          echo "The exact V16 tone-finishing chain is applied before segmentation."
          echo "No real-person voice cloning. No speed or pitch manipulation. No syllable stitching."
          echo "V17 remains rejected and visio-test.html is not switched to V18 without human listening approval."
