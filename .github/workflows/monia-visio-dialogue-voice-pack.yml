name: MonIA Lucas Visio Dialogue Voice Pack

on:
  push:
    branches: [main]
    paths:
      - "scripts/monia_visio_dialogue_voice_pack.py"
      - ".github/workflows/monia-visio-dialogue-voice-pack.yml"
  workflow_dispatch:

jobs:
  generate-dialogue-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow
      - name: Generate dialogue pack anchored to exact selected V10-A
        run: python -m scripts.monia_visio_dialogue_voice_pack
      - name: Verify public dialogue audio
        run: |
          python - <<'PY'
          import requests
          base='https://marion-lucas.marionbolomey.fr/resources/monia/generated/'
          for key in ('opening','calm','warm','busy','tease','miss','end'):
              url=base+f'lucas-visio-dialogue-v2-{key}-candidate.wav'
              r=requests.get(url,timeout=60,headers={'Cache-Control':'no-cache'})
              r.raise_for_status()
              assert len(r.content)>4096,(key,len(r.content))
              assert r.content[:4]==b'RIFF',(key,r.content[:12])
              print('verified',key,url,len(r.content))
          PY
      - name: Candidate-only policy
        run: |
          echo "Opening is exact V10-A selected sample."
          echo "Other phrases use native-French timing plus Seed-VC timbre conversion toward exact V10-A."
          echo "No new voice-design identity is accepted as Lucas."
          echo "No live manifest mutation. No browser speechSynthesis fallback."
