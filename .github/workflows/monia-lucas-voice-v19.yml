name: MonIA Lucas V19 Prosody First

on:
  push:
    branches: [main]
    paths:
      - "scripts/monia_lucas_voice_v19_prosody_first.py"
      - ".github/workflows/monia-lucas-voice-v19.yml"
  workflow_dispatch:

jobs:
  generate-v19:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate V19 prosody-first candidates
        run: python -m scripts.monia_lucas_voice_v19_prosody_first --publish-candidate
      - name: Verify public V19 candidates
        run: |
          python - <<'PY'
          import requests
          base='https://marion-lucas.marionbolomey.fr/resources/monia/generated/'
          for key in ('a','b'):
              url=base+f'lucas-voice-v19-{key}-prosody-first-fr-candidate.wav'
              r=requests.get(url,timeout=60,headers={'Cache-Control':'no-cache'})
              r.raise_for_status()
              assert len(r.content)>4096,(key,len(r.content))
              assert r.content[:4]==b'RIFF',(key,r.content[:12])
              print('verified',key,url,len(r.content))
          PY
      - name: Candidate-only policy
        run: |
          echo "V19 separates French prosody from synthetic Lucas timbre."
          echo "Synthetic donor first, then synthetic-to-synthetic Seed-VC toward approved V16."
          echo "No real-person biometric voice cloning."
          echo "No live visio/runtime mutation. No auto-promotion."
