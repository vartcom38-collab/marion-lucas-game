name: Analyze Dominic 008 Frames

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-dominic-008.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Extract review frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-008
          SRC='public/resources/monia/candidates/dominic-seated-monia-library-008/shot-01.mp4'
          ffmpeg -y -v error -i "$SRC" -vf "select='eq(n,0)+eq(n,3)+eq(n,6)+eq(n,9)+eq(n,13)'" -vsync 0 review-008/frame-%02d.jpg
          ffmpeg -y -v error -i "$SRC" -vf "fps=7,scale=256:-1,tile=7x2" -frames:v 1 review-008/contact-sheet.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: dominic-008-review
          path: review-008/
          if-no-files-found: error
