name: MonIA Lucas Visio 2.0 Presence Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/monia_visio_presence_pack.py"
      - ".github/workflows/monia-visio-presence-pack.yml"
      - "config/monia-performance-reference-notes.json"

permissions:
  contents: read

jobs:
  generate-visio-presence-state:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        state: [listening, reaction, thinking, speaking-calm, speaking-warm, speaking-busy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install MonIA dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow

      - name: Generate one Visio 2.0 presence state
        run: python -m scripts.monia_visio_presence_pack --state "${{ matrix.state }}" --publish-candidate

      - name: Verify generated state publicly
        run: |
          python - <<'PY'
          import os, requests
          state=os.environ['STATE']
          base='https://marion-lucas.marionbolomey.fr/resources/monia/generated/'
          name = f'visio-lucas-v2-{state}-candidate.mp4'
          url=base+name
          r=requests.get(url,timeout=60,headers={'Range':'bytes=0-127','Cache-Control':'no-cache','Accept':'video/*,*/*'})
          ok=r.status_code in (200,206) and len(r.content)>=16 and (b'ftyp' in r.content[:64] or r.content.startswith(b'RIFF') or r.content.startswith(b'\x1aE\xdf\xa3'))
          print(name,'status',r.status_code,'bytes',len(r.content),'ok',ok)
          if not ok:
              raise SystemExit('Visio 2.0 candidate verification failed: '+name)
          PY
        env:
          STATE: ${{ matrix.state }}

      - name: Candidate-only policy
        run: |
          echo "Candidate only: true"
          echo "Main game integration: forbidden until explicit user validation"
          echo "Visual anchor: exact validated V7-derived frame"
          echo "Speaking states: native generated mouth/timing, then timbre conversion toward exact V10-A"
          echo "Wav2Lip/MuseTalk/pasted-mouth/playback warp: forbidden"
