name: MonIA Lucas Visio 2.0 Presence Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/monia_visio_presence_pack.py"
      - ".github/workflows/monia-visio-presence-pack.yml"
      - "config/monia-performance-reference-notes.json"

permissions:
  contents: read

jobs:
  generate-visio-presence-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install MonIA dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client requests pillow

      - name: Generate Visio 2.0 presence states
        run: python -m scripts.monia_visio_presence_pack --publish-candidate

      - name: Verify candidate pack publicly
        run: |
          python - <<'PY'
          import requests
          base='https://marion-lucas.marionbolomey.fr/resources/monia/generated/'
          names=(
            'visio-lucas-v2-listening-candidate.mp4',
            'visio-lucas-v2-reaction-candidate.mp4',
            'visio-lucas-v2-thinking-candidate.mp4',
            'visio-lucas-v2-speaking-calm-candidate.mp4',
            'visio-lucas-v2-speaking-warm-candidate.mp4',
            'visio-lucas-v2-speaking-busy-candidate.mp4',
          )
          for name in names:
              url=base+name
              r=requests.get(url,timeout=60,headers={'Range':'bytes=0-127','Cache-Control':'no-cache','Accept':'video/*,*/*'})
              ok=r.status_code in (200,206) and len(r.content)>=16 and (b'ftyp' in r.content[:64] or r.content.startswith(b'RIFF') or r.content.startswith(b'\x1aE\xdf\xa3'))
              print(name,'status',r.status_code,'bytes',len(r.content),'ok',ok)
              if not ok:
                  raise SystemExit('Visio 2.0 candidate verification failed: '+name)
          PY

      - name: Candidate-only policy
        run: |
          echo "Candidate only: true"
          echo "Main game integration: forbidden until explicit user validation"
          echo "Visual anchor: frame extracted from exact validated V7 run 34826963016"
          echo "Listening/reaction/thinking: alive silent states, no speech overlay"
          echo "Speaking: native generated mouth/timing, then timbre conversion toward exact V10-A"
          echo "Wav2Lip/MuseTalk/pasted-mouth: forbidden"
          echo "Playback-rate warp: forbidden"
