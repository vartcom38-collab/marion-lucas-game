name: MonIA Lucas Voice Profile Test

on:
  push:
    branches: [main]
    paths:
      - "config/lucas-voice-profile.json"
      - "scripts/monia_lucas_voice_profile_test.py"
      - ".github/workflows/monia-lucas-voice-profile-test.yml"
  workflow_dispatch:

jobs:
  generate-profile-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INFOMANIAK_FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
      INFOMANIAK_FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check gradio_client numpy requests pillow
      - name: Generate one Lucas warm voice candidate
        run: python -m scripts.monia_lucas_voice_profile_test
      - name: Verify published candidate
        run: |
          python - <<'PY'
          import requests
          url='https://marion-lucas.marionbolomey.fr/resources/monia/generated/lucas-visio-dialogue-profile-warm-candidate.wav'
          r=requests.get(url,timeout=60,headers={'Cache-Control':'no-cache'})
          r.raise_for_status()
          assert len(r.content)>4096,len(r.content)
          assert r.content[:4]==b'RIFF',r.content[:12]
          print('verified',url,len(r.content))
          PY
      - name: Candidate-only policy
        run: |
          echo "Profile-guided test only."
          echo "No live manifest mutation."
          echo "No auto-promotion."
