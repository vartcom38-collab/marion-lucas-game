<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dernière visio MonIA</title><style>body{margin:0;background:#0b0a09;color:#fff;font-family:Inter,system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.wrap{width:min(92vw,720px);text-align:center;padding:24px}.card{background:#171513;border:1px solid #2d2926;border-radius:20px;padding:20px}.status{opacity:.72;margin-bottom:16px}video{width:min(100%,520px);max-height:78vh;background:#000;border-radius:16px}a{display:inline-block;margin-top:14px;color:#fff;font-weight:700}</style></head><body><div class="wrap"><div class="card"><h1>Dernière visio MonIA</h1><p id="status" class="status">Recherche de la dernière vidéo…</p><div id="out"></div></div></div><script type="module">const status=document.getElementById('status');const out=document.getElementById('out');async function load(){try{const r=await fetch('/api/monia-latest-visio.php',{cache:'no-store'});const d=await r.json();if(!d?.url){status.textContent='Aucune visio MonIA sauvegardée pour le moment.';return}const abs=new URL(d.url,location.origin).href;status.textContent=d.updatedAt?`Dernière vidéo sauvegardée · ${new Date(d.updatedAt).toLocaleString('fr-FR')}`:'Dernière vidéo sauvegardée';const v=document.createElement('video');v.src=abs;v.controls=true;v.playsInline=true;v.autoplay=true;v.muted=true;out.appendChild(v);const a=document.createElement('a');a.href=abs;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Ouvrir la vidéo directement';out.appendChild(a)}catch(e){status.textContent='Impossible de lire la dernière vidéo pour le moment.'}}load();setInterval(load,15000);</script></body></html>
