<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MonIA Test Lab</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0c0b0a;color:#fff}main{max-width:980px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#171513;border:1px solid #2c2926;border-radius:18px;padding:18px}textarea,input,select{width:100%;box-sizing:border-box;background:#0f0e0d;color:#fff;border:1px solid #393532;border-radius:12px;padding:11px;margin-top:6px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{border:0;border-radius:999px;padding:10px 15px;cursor:pointer}.primary{background:#fff;color:#111}.ghost{background:#2b2724;color:#fff}.log{white-space:pre-wrap;min-height:180px;background:#0a0908;border-radius:12px;padding:14px;overflow:auto}.status{font-size:.9rem;opacity:.75}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#292622;font-size:.78rem}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>MonIA Test Lab</h1><p class="status">Page séparée du jeu pour tester l'IA sans avancer dans l'histoire.</p><div class="grid"><section class="card"><label>Message à Lucas<textarea id="msg" rows="5" placeholder="Ex: Tu fais quoi là ?"></textarea></label><div class="buttons"><button class="primary" data-channel="text">Tester SMS</button><button class="ghost" data-channel="voice">Tester vocal</button><button class="ghost" data-channel="visio">Tester visio</button><button class="ghost" data-channel="scene">Tester scène</button></div><label>Lieu<input id="place" value="Nîmes"></label><label>Heure<input id="time" value="20:30"></label><label>Relation<select id="relationship"><option>relation naissante</option><option selected>relation affectueuse en construction</option><option>relation proche et solide</option><option>relation très forte et intime</option></select></label></section><section class="card"><div class="pill" id="engine">MonIA locale</div><h3>Réponse</h3><div id="answer" class="log">Prête.</div><h3>JSON brut</h3><div id="raw" class="log">—</div></section></div><p class="status" style="margin-top:18px">Astuce : le premier chargement du modèle local peut être plus long. Ensuite les réponses sont plus rapides.</p></main><script type="module" src="/src/monia/test-page.ts"></script></body></html>
