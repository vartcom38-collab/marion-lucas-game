  <button class="hotspot" id="newBtn" aria-label="Nouvelle partie"></button>
  <button class="hotspot" id="continueBtn" aria-label="Continuer"></button>
  <button class="hotspot" id="loadBtn" aria-label="Charger une sauvegarde"></button>
  <button class="hotspot" id="settingsBtn" aria-label="Paramètres"></button>
  <div class="toast" id="toast"></div>
  <div class="modalBack" id="settingsPanel" role="dialog" aria-modal="true" aria-label="Paramètres"><section class="modal"><h2>Paramètres</h2><div class="row"><span>Musique</span><input id="music" type="checkbox" checked></div><div class="row"><span>Effets sonores</span><input id="sfx" type="checkbox" checked></div><div class="row"><span>Mode cinématique</span><input id="cinematic" type="checkbox" checked></div><button class="close" id="closeSettings">Fermer</button></section></div>
  <section class="start" id="startScreen"><div class="startInner"><div class="eyebrow">Nîmes • Jour 1</div><h1>La vie de Marion commence.</h1><p>La prochaine étape sera la première vraie scène jouable : Marion chez elle, la feria qui s'éveille et une journée qui peut prendre une direction inattendue.</p><button class="back" id="backBtn">Retour à l'accueil</button></div></section>
</main>
<script>
const SAVE_KEY='marion-lucas-save-v1';const toast=document.getElementById('toast');const settings=document.getElementById('settingsPanel');const startScreen=document.getElementById('startScreen');let toastTimer;function say(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}function getSave(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch{return null}}function openGame(isNew){let save=getSave();if(isNew){save={day:1,place:'Nîmes',time:'09:00',marionAge:20,lucasAge:22,createdAt:Date.now(),updatedAt:Date.now()};localStorage.setItem(SAVE_KEY,JSON.stringify(save))}else if(!save){say('Aucune partie sauvegardée sur cet appareil.');return}startScreen.classList.add('open')}document.getElementById('newBtn').addEventListener('click',()=>openGame(true));document.getElementById('continueBtn').addEventListener('click',()=>openGame(false));document.getElementById('loadBtn').addEventListener('click',()=>{const s=getSave();if(!s){say('Aucune sauvegarde disponible.');return}say(`Sauvegarde : Jour ${s.day||1} • ${s.place||'Nîmes'} • ${s.time||'09:00'}`);setTimeout(()=>openGame(false),700)});document.getElementById('settingsBtn').addEventListener('click',()=>settings.classList.add('open'));document.getElementById('closeSettings').addEventListener('click',()=>settings.classList.remove('open'));settings.addEventListener('click',e=>{if(e.target===settings)settings.classList.remove('open')});document.getElementById('backBtn').addEventListener('click',()=>startScreen.classList.remove('open'));
</script>
