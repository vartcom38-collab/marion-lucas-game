<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Marion & Lucas</title><link rel="stylesheet" href="./src/styles.css"><style>#globalHomeButton{position:fixed;right:14px;bottom:14px;z-index:10000;border:1px solid rgba(255,255,255,.28);background:rgba(18,15,13,.76);color:#fff;border-radius:999px;padding:9px 13px;font:600 12px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.02em;backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.22);cursor:pointer}#globalHomeButton:hover{background:rgba(18,15,13,.9)}@media(max-width:700px){#globalHomeButton{right:10px;bottom:10px;padding:8px 11px;font-size:11px}}</style></head><body><div id="app"></div><video id="introVideo" src="./resources/marion-nimes.mp4" preload="metadata" playsinline hidden></video><video id="lucasVideo" src="./resources/monia/generated/intro-lucas-candidate-desktop.mp4" preload="metadata" playsinline hidden></video><script>(function(){const SAVE='marion-lucas-save-v4',OLD='marion-lucas-save-v3';const params=new URLSearchParams(location.search);if(params.get('reset')==='1'){localStorage.removeItem(SAVE);localStorage.removeItem(OLD);history.replaceState({},'',location.pathname)}else if(params.get('home')==='1'){for(const key of [SAVE,OLD]){try{const raw=localStorage.getItem(key);if(!raw)continue;const s=JSON.parse(raw);s.screen='menu';s.overlay=null;localStorage.setItem(key,JSON.stringify(s));break}catch{}}history.replaceState({},'',location.pathname)}function goHome(){let changed=false;for(const key of [SAVE,OLD]){try{const raw=localStorage.getItem(key);if(!raw)continue;const s=JSON.parse(raw);s.screen='menu';s.overlay=null;localStorage.setItem(key,JSON.stringify(s));changed=true;break}catch{}}location.reload()}function sync(){const app=document.getElementById('app');if(!app)return;const active=!!app.querySelector('.game,.cine,.simplePage');let b=document.getElementById('globalHomeButton');if(active&&!b){b=document.createElement('button');b.id='globalHomeButton';b.type='button';b.textContent='↩ Accueil';b.setAttribute('aria-label','Retour à l’écran d’accueil');b.addEventListener('click',goHome);document.body.appendChild(b)}else if(!active&&b)b.remove()}new MutationObserver(sync).observe(document.getElementById('app'),{childList:true,subtree:true});window.addEventListener('DOMContentLoaded',sync)})();</script><script type="module" src="./src/main.ts"></script><script type="module" src="./src/intro-sequence.ts"></script><script type="module" src="./src/intro-arrival.ts"></script><script type="module" src="./src/home-living.ts"></script><script type="module" src="./src/gameplay-cinematic.ts"></script><script type="module" src="./src/living-world.ts"></script><script type="module" src="./src/living-world-media.ts"></script><script type="module" src="./src/living-audio.ts"></script><script type="module" src="./src/monia/memory-bridge.ts"></script><script type="module" src="./src/monia/presentation-bridge.ts"></script><script type="module" src="./src/monia/premium-voice-bridge.ts"></script><script type="module" src="./src/monia/integration.ts"></script><script type="module" src="./src/monia/visio-state-media.ts"></script><script type="module" src="./src/monia/live-visio.ts"></script><script type="module" src="./src/monia/visio-conversation.ts"></script><script type="module" src="./src/monia/long-drama.ts"></script><script type="module" src="./src/monia/long-drama-bridge.ts"></script><script type="module" src="./src/monia/initiative.ts"></script><script type="module" src="./src/monia/scene-runtime.ts"></script><script type="module" src="./src/monia/auto-scene.ts"></script></body></html>
