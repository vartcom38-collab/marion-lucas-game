<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#21140f" />
<title>Marion & Lucas</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#21140f;color:#fff;overflow:hidden}body{font-family:Inter,Arial,sans-serif;display:grid;place-items:center}.stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:#2b1912;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.35)}#cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.hotspot{position:absolute;left:67.4%;width:27.4%;height:8.5%;border:0;border-radius:999px;background:transparent;cursor:pointer;outline:none;transition:box-shadow .18s,background .18s,transform .18s}.hotspot:hover,.hotspot:focus-visible{background:rgba(255,255,255,.07);box-shadow:0 0 0 2px rgba(255,215,139,.8),0 0 25px rgba(255,205,120,.3);transform:scale(1.006)}#newBtn{top:44.9%}#continueBtn{top:55.0%}#loadBtn{top:65.2%}#settingsBtn{top:75.4%}.toast{position:absolute;left:50%;bottom:3.2%;transform:translate(-50%,20px);background:rgba(28,18,15,.82);backdrop-filter:blur(12px);border:1px solid rgba(255,224,176,.42);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.modalBack{position:absolute;inset:0;background:rgba(15,9,7,.42);backdrop-filter:blur(8px);display:none;place-items:center}.modalBack.open{display:grid}.modal{width:min(430px,86%);background:rgba(41,26,21,.92);border:1px solid rgba(255,218,157,.55);border-radius:24px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.45)}.modal h2{font:500 32px Georgia,serif;margin:0 0 18px}.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}.close{width:100%;margin-top:18px;border:1px solid rgba(255,218,157,.55);background:#8b2635;color:#fff;padding:13px;border-radius:999px;font-weight:700;cursor:pointer}.start{position:absolute;inset:0;display:none;background:linear-gradient(135deg,#f5dfc7,#d99d74);color:#3b2118;place-items:center;text-align:center;padding:30px}.start.open{display:grid}.startInner{max-width:700px}.start .eyebrow{letter-spacing:.22em;text-transform:uppercase;font-size:12px}.start h1{font:500 clamp(44px,6vw,90px)/.95 Georgia,serif;margin:16px 0}.start p{font-size:17px;line-height:1.6}.back{margin-top:18px;padding:12px 22px;border-radius:999px;border:1px solid #704635;background:#8b2635;color:#fff;font-weight:700;cursor:pointer}@media(max-aspect-ratio:1/1){body{background:#1a0f0c}.stage{width:100vw;max-width:100vw}.toast{bottom:2%;font-size:11px}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Écran d'accueil Marion et Lucas">
  <img id="cover" src="assets/cover.jpg?v=6" alt="Marion et Lucas devant les arènes de Nîmes, écran d'accueil du jeu" />
  <button class="hotspot" id="newBtn" aria-label="Nouvelle partie"></button>
  <button class="hotspot" id="continueBtn" aria-label="Continuer"></button>
  <button class="hotspot" id="loadBtn" aria-label="Charger une sauvegarde"></button>
  <button class="hotspot" id="settingsBtn" aria-label="Paramètres"></button>
  <div class="toast" id="toast"></div>
  <div class="modalBack" id="settingsPanel" role="dialog" aria-modal="true" aria-label="Paramètres"><section class="modal"><h2>Paramètres</h2><div class="row"><span>Musique</span><input id="music" type="checkbox" checked></div><div class="row"><span>Effets sonores</span><input id="sfx" type="checkbox" checked></div><div class="row"><span>Mode cinématique</span><input id="cinematic" type="checkbox" checked></div><button class="close" id="closeSettings">Fermer</button></section></div>
  <section class="start" id="startScreen"><div class="startInner"><div class="eyebrow">Nîmes • Jour 1</div><h1>La vie de Marion commence.</h1><p>La prochaine étape sera la première vraie scène jouable : Marion chez elle, la feria qui s'éveille et une journée qui peut prendre une direction inattendue.</p><button class="back" id="backBtn">Retour à l'accueil</button></div></section>
</main>
<script>
const SAVE_KEY='marion-lucas-save-v1';const toast=document.getElementById('toast');const settings=document.getElementById('settingsPanel');const startScreen=document.getElementById('startScreen');let toastTimer;function say(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}function getSave(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch{return null}}function openGame(isNew){let save=getSave();if(isNew){save={day:1,place:'Nîmes',time:'09:00',marionAge:20,lucasAge:22,createdAt:Date.now(),updatedAt:Date.now()};localStorage.setItem(SAVE_KEY,JSON.stringify(save))}else if(!save){say('Aucune partie sauvegardée sur cet appareil.');return}startScreen.classList.add('open')}document.getElementById('newBtn').addEventListener('click',()=>openGame(true));document.getElementById('continueBtn').addEventListener('click',()=>openGame(false));document.getElementById('loadBtn').addEventListener('click',()=>{const s=getSave();if(!s){say('Aucune sauvegarde disponible.');return}say(`Sauvegarde : Jour ${s.day||1} • ${s.place||'Nîmes'} • ${s.time||'09:00'}`);setTimeout(()=>openGame(false),700)});document.getElementById('settingsBtn').addEventListener('click',()=>settings.classList.add('open'));document.getElementById('closeSettings').addEventListener('click',()=>settings.classList.remove('open'));settings.addEventListener('click',e=>{if(e.target===settings)settings.classList.remove('open')});document.getElementById('backBtn').addEventListener('click',()=>startScreen.classList.remove('open'));
</script>
</body>
</html>
