<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Test visio Lucas</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050505;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}body{display:grid;place-items:center}.phone{position:relative;width:min(100vw,430px);height:100dvh;max-height:920px;background:#050505;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.45)}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;transform:scale(1.035);background:#090807}.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.2),transparent 18%,transparent 66%,rgba(0,0,0,.58) 100%);pointer-events:none}.status{position:absolute;top:max(16px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:14px;text-shadow:0 2px 12px rgba(0,0,0,.7);z-index:5}.left,.right{display:flex;gap:9px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#39d56f}.battery{width:25px;height:12px;border:2px solid rgba(255,255,255,.86);border-radius:4px;position:relative}.battery:after{content:"";position:absolute;right:-5px;top:2px;width:2px;height:5px;border-radius:0 2px 2px 0;background:rgba(255,255,255,.7)}.battery:before{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:15px;background:#fff;border-radius:1px}.name{position:absolute;top:max(54px,calc(env(safe-area-inset-top) + 38px));left:18px;color:white;z-index:5;text-shadow:0 2px 12px #000;font-weight:700}.name small{display:block;font-size:12px;font-weight:500;color:rgba(255,255,255,.72);margin-top:3px}.self{position:absolute;z-index:7;right:16px;top:max(74px,calc(env(safe-area-inset-top) + 58px));width:95px;aspect-ratio:3/4;border-radius:18px;background:linear-gradient(145deg,#292929,#111);border:1px solid rgba(255,255,255,.2);box-shadow:0 12px 28px rgba(0,0,0,.32);display:grid;place-items:center;color:rgba(255,255,255,.6);font-size:11px;text-align:center;padding:10px}.talk{position:absolute;left:14px;right:14px;bottom:max(120px,calc(env(safe-area-inset-bottom) + 110px));z-index:8;display:flex;flex-direction:column;gap:9px;align-items:center}.line{max-width:92%;padding:10px 14px;border-radius:16px;background:rgba(7,7,9,.58);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:white;text-align:center;font-size:15px;line-height:1.38;opacity:0;transform:translateY(8px);transition:.2s}.line.show{opacity:1;transform:none}.choices{width:min(92%,520px);display:grid;gap:8px;opacity:0;transform:translateY(10px);transition:.2s}.choices.show{opacity:1;transform:none}.choice{border:1px solid rgba(255,255,255,.18);border-radius:15px;padding:11px 14px;background:rgba(17,17,19,.74);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);color:white;font:600 14px/1.2 system-ui;text-align:left;cursor:pointer}.choice:active{transform:scale(.985)}.thinking{padding:8px 11px;border-radius:999px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);color:rgba(255,255,255,.78);font-size:13px}.controls{position:absolute;z-index:9;left:50%;bottom:max(22px,calc(env(safe-area-inset-bottom) + 12px));transform:translateX(-50%);display:flex;gap:36px;align-items:center}.ctrl{width:60px;height:60px;border:0;border-radius:50%;background:rgba(29,29,31,.82);color:white;font-size:22px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(12px)}.ctrl.end{width:68px;height:68px;background:#ef4138}.badge{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:20;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.12);font-size:11px;color:rgba(255,255,255,.8);letter-spacing:.02em}.ended{position:absolute;inset:0;z-index:30;background:#050505;display:none;place-items:center;text-align:center;color:white;padding:30px}.ended.show{display:grid}.ended button{margin-top:16px;border:0;border-radius:999px;padding:11px 16px;background:white;color:#111;font-weight:700;cursor:pointer}@media(min-width:700px){body{background:#161616}.phone{height:min(92vh,900px);border-radius:32px}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <video id="lucasVideo" autoplay playsinline loop src="https://marion-lucas.marionbolomey.fr/resources/monia/generated/visio-lucas-v7-v10a-timing-candidate.mp4?run=34859820027"></video>
  <div class="shade"></div>
  <div class="badge">PROTOTYPE VISIO — HORS JEU</div>
  <div class="status"><div class="left">▮▮▮▮ <span>⌁</span></div><div class="right"><i class="dot"></i><i class="battery"></i></div></div>
  <div class="name">Lucas<small>visio</small></div>
  <div class="self" id="selfView">Aperçu caméra<br>simulé pour le test</div>
  <div class="talk"><div class="line" id="line"></div><div class="choices" id="choices"></div></div>
  <div class="controls"><button class="ctrl" id="camera">▣</button><button class="ctrl end" id="end">⌕</button><button class="ctrl" id="mic">♩</button></div>
  <div class="ended" id="ended"><div><h2>Appel terminé</h2><p>Prototype uniquement. Rien n’a été ajouté à ta partie.</p><button id="restart">Recommencer le test</button></div></div>
</div>
<script>
const line=document.getElementById('line'),choices=document.getElementById('choices'),ended=document.getElementById('ended'),video=document.getElementById('lucasVideo');
let turn=0, path='';
const scenes={
 start:{text:'Salut… ça va, toi ? Qu’est-ce que tu racontes ?',choices:['Ça va, et toi ?','Je voulais juste te voir','Tu fais quoi là ?']},
 calm:{text:'Ça va… journée un peu longue, mais tranquille. Et toi, t’as fait quoi ?',choices:['Pas grand-chose','J’ai pensé à toi','Je te raconterai plus tard']},
 warm:{text:'Ah ouais ?… Ça me fait plaisir que tu m’appelles juste pour ça.',choices:['Tu me manquais un peu','Fais pas le malin','Raconte-moi ta journée']},
 busy:{text:'Je viens de me poser deux minutes. J’allais justement souffler un peu.',choices:['Je te laisse respirer','Non, reste un peu','T’as l’air crevé']},
 tease:{text:'Je fais pas le malin. Enfin… pas tant que ça.',choices:['Si, un peu','Ça te va bien','Bon, continue']},
 miss:{text:'Toi aussi, un peu.',choices:['Un peu seulement ?','Je prends','On se voit bientôt ?']},
 end:{text:'D’accord… on se reparle après.',choices:['Raccrocher']}
};
function stateFor(text){if(/voir/i.test(text))return'warm';if(/fais pas|malin/i.test(text))return'tease';if(/manqu/i.test(text))return'miss';if(/fais quoi|crev|respirer/i.test(text))return'busy';if(/raccrocher|laisse/i.test(text))return'end';return'calm'}
function speak(text,next){choices.classList.remove('show');line.textContent=text;line.classList.add('show');setTimeout(()=>{line.classList.remove('show');showChoices(next)},Math.max(1800,Math.min(3800,text.length*42)))}
function showChoices(items){choices.innerHTML='';items.forEach(t=>{const b=document.createElement('button');b.className='choice';b.textContent=t;b.onclick=()=>select(t);choices.appendChild(b)});requestAnimationFrame(()=>choices.classList.add('show'))}
function select(text){choices.classList.remove('show');if(text==='Raccrocher'){finish();return}turn++;const thinking=document.createElement('div');thinking.className='thinking';thinking.textContent='Lucas…';choices.before(thinking);setTimeout(()=>{thinking.remove();const key=stateFor(text);const s=scenes[key]||scenes.calm;speak(s.text,s.choices)},650+Math.random()*500)}
function finish(){video.pause();ended.classList.add('show')}
function start(){turn=0;ended.classList.remove('show');video.currentTime=0;video.play().catch(()=>{});setTimeout(()=>speak(scenes.start.text,scenes.start.choices),700)}
document.getElementById('end').onclick=finish;document.getElementById('restart').onclick=start;document.getElementById('camera').onclick=e=>{e.currentTarget.style.background=e.currentTarget.style.background?'':'rgba(245,245,247,.92)';e.currentTarget.style.color=e.currentTarget.style.color?'':'#111';document.getElementById('selfView').style.display=document.getElementById('selfView').style.display==='none'?'grid':'none'};document.getElementById('mic').onclick=e=>{e.currentTarget.style.background=e.currentTarget.style.background?'':'rgba(245,245,247,.92)';e.currentTarget.style.color=e.currentTarget.style.color?'':'#111'};
start();
</script>
</body>
</html>
