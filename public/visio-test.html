<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Test visio Lucas</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050505;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}body{display:grid;place-items:center}.phone{position:relative;width:min(100vw,430px);height:100dvh;max-height:920px;background:#050505;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.45)}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;background:#090807;transform:none}.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.18),transparent 18%,transparent 67%,rgba(0,0,0,.62) 100%);pointer-events:none}.status{position:absolute;top:max(16px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:14px;text-shadow:0 2px 12px rgba(0,0,0,.7);z-index:5}.left,.right{display:flex;gap:9px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#39d56f}.battery{width:25px;height:12px;border:2px solid rgba(255,255,255,.86);border-radius:4px;position:relative}.battery:after{content:"";position:absolute;right:-5px;top:2px;width:2px;height:5px;border-radius:0 2px 2px 0;background:rgba(255,255,255,.7)}.battery:before{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:15px;background:#fff;border-radius:1px}.name{position:absolute;top:max(54px,calc(env(safe-area-inset-top) + 38px));left:18px;color:white;z-index:5;text-shadow:0 2px 12px #000;font-weight:700}.name small{display:block;font-size:12px;font-weight:500;color:rgba(255,255,255,.72);margin-top:3px}.self{position:absolute;z-index:7;right:16px;top:max(74px,calc(env(safe-area-inset-top) + 58px));width:95px;aspect-ratio:3/4;border-radius:18px;background:linear-gradient(145deg,#292929,#111);border:1px solid rgba(255,255,255,.2);box-shadow:0 12px 28px rgba(0,0,0,.32);display:grid;place-items:center;color:rgba(255,255,255,.6);font-size:11px;text-align:center;padding:10px}.talk{position:absolute;left:14px;right:14px;bottom:max(114px,calc(env(safe-area-inset-bottom) + 104px));z-index:8;display:flex;flex-direction:column;gap:9px;align-items:center}.choices{width:min(92%,520px);display:grid;gap:8px;opacity:0;transform:translateY(10px);transition:.2s}.choices.show{opacity:1;transform:none}.choice{border:1px solid rgba(255,255,255,.18);border-radius:15px;padding:11px 14px;background:rgba(17,17,19,.74);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);color:white;font:600 14px/1.2 system-ui;text-align:left;cursor:pointer}.choice:active{transform:scale(.985)}.listening{padding:8px 11px;border-radius:999px;background:rgba(0,0,0,.26);backdrop-filter:blur(8px);color:rgba(255,255,255,.76);font-size:12px;display:none}.listening.show{display:block}.controls{position:absolute;z-index:9;left:18px;right:18px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 14px));display:grid;grid-template-columns:repeat(3,60px);justify-content:center;gap:30px;align-items:center}.ctrl{width:60px;height:60px;border:0;border-radius:50%;background:rgba(29,29,31,.86);color:white;font-size:22px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 7px 18px rgba(0,0,0,.24)}.ctrl.end{width:60px;height:60px;background:#ef4138}.ctrl.off{opacity:.55}.startgate{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(0,0,0,.18);backdrop-filter:blur(2px)}.startgate button{border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:13px 18px;background:rgba(10,10,12,.72);backdrop-filter:blur(14px);color:white;font-weight:700}.ended{position:absolute;inset:0;z-index:30;background:#050505;display:none;place-items:center;text-align:center;color:white;padding:30px}.ended.show{display:grid}.ended button{margin-top:16px;border:0;border-radius:999px;padding:11px 16px;background:white;color:#111;font-weight:700;cursor:pointer}@media(min-width:700px){body{background:#161616}.phone{height:min(92vh,900px);border-radius:32px}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <video id="lucasVideo" playsinline preload="auto"></video>
  <div class="shade"></div>
  <div class="status"><div class="left">▮▮▮▮ <span>⌁</span></div><div class="right"><i class="dot"></i><i class="battery"></i></div></div>
  <div class="name">Lucas<small>visio</small></div>
  <div class="self" id="selfView">Aperçu caméra</div>
  <div class="talk"><div class="listening" id="listening">Lucas t’écoute…</div><div class="choices" id="choices"></div></div>
  <div class="controls"><button class="ctrl" id="camera" aria-label="Caméra">▣</button><button class="ctrl end" id="end" aria-label="Raccrocher">⌕</button><button class="ctrl" id="mic" aria-label="Micro">♩</button></div>
  <div class="startgate" id="startgate"><button id="startCall">Démarrer l’appel</button></div>
  <div class="ended" id="ended"><div><h2>Appel terminé</h2><p>Prototype uniquement. Rien n’a été ajouté à ta partie.</p><button id="restart">Recommencer le test</button></div></div>
</div>
<script>
const choices=document.getElementById('choices'),ended=document.getElementById('ended'),video=document.getElementById('lucasVideo'),listening=document.getElementById('listening'),startgate=document.getElementById('startgate');
const BASE='https://marion-lucas.marionbolomey.fr/resources/monia/generated/';
const BASE_VISIO=BASE+'visio-lucas-v7-v10a-timing-candidate.mp4?run=34859820027';
// One fixed phone-camera framing throughout the call: no cinematic zoom clips.
const VISUALS={opening:BASE_VISIO,calm:BASE_VISIO,warm:BASE_VISIO,busy:BASE_VISIO,tease:BASE_VISIO,miss:BASE_VISIO,end:BASE_VISIO};
let audio=null,playToken=0;
const scenes={
 opening:{audio:'opening',choices:[['Ça va, et toi ?','calm'],['Je voulais juste te voir','warm'],['Tu fais quoi là ?','busy']]},
 calm:{audio:'calm',choices:[['Pas grand-chose','calm'],['J’ai pensé à toi','warm'],['Je te raconterai plus tard','end']]},
 warm:{audio:'warm',choices:[['Tu me manquais un peu','miss'],['Fais pas le malin','tease'],['Raconte-moi ta journée','busy']]},
 busy:{audio:'busy',choices:[['Je te laisse respirer','end'],['Non, reste un peu','warm'],['T’as l’air crevé','calm']]},
 tease:{audio:'tease',choices:[['Si, un peu','tease'],['Ça te va bien','warm'],['Bon, continue','busy']]},
 miss:{audio:'miss',choices:[['Un peu seulement ?','tease'],['Je prends','warm'],['On se voit bientôt ?','calm']]},
 end:{audio:'end',choices:[['Raccrocher','finish']]}
};
function showChoices(items){choices.innerHTML='';items.forEach(([label,next])=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>select(next);choices.appendChild(b)});requestAnimationFrame(()=>choices.classList.add('show'))}
function waitFor(el,event,timeout=1800){return new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(t);el.removeEventListener(event,finish);resolve()};const t=setTimeout(finish,timeout);el.addEventListener(event,finish,{once:true})})}
async function prepareVisual(key,{muted=true,rewind=true}={}){
  const wanted=VISUALS[key]||BASE_VISIO;
  const absolute=new URL(wanted,location.href).href;
  video.pause();video.muted=muted;video.playbackRate=1;
  if(video.src!==absolute){video.src=wanted;video.load();await waitFor(video,'loadedmetadata')}
  if(rewind){try{video.currentTime=0}catch{}}
  if(video.readyState<2)await waitFor(video,'canplay');
  if(rewind){try{video.currentTime=0}catch{}}
}
// Listening keeps the exact frame where Lucas finished. No snap back to frame 0.
function resetVisioToListening(){video.pause();video.muted=true;listening.classList.add('show')}
function audioUrl(key,version){return BASE+`lucas-visio-dialogue-${version}-${key}-candidate.wav?v=${version}`}
async function playOpeningNative(onend,token){
  if(audio){audio.pause();audio=null}
  await prepareVisual('opening',{muted:false,rewind:true});
  if(token!==playToken)return;
  choices.classList.remove('show');listening.classList.remove('show');
  video.onended=()=>{if(token!==playToken)return;video.muted=true;resetVisioToListening();onend?.()};
  try{video.currentTime=0;video.volume=1;await video.play()}catch{video.muted=true;resetVisioToListening();listening.textContent='Touchez une fois l’écran pour autoriser le son'}
}
async function startPair(key,version,onend,token){
  const a=new Audio(audioUrl(key,version));audio=a;a.preload='auto';
  const audioReady=waitFor(a,'canplaythrough',1800);
  await Promise.all([prepareVisual(key,{muted:true,rewind:true}),audioReady]);
  if(token!==playToken||audio!==a)return null;
  return new Promise(resolve=>{
    let failed=false;
    const fail=()=>{if(failed)return;failed=true;a.pause();resolve(null)};
    a.onerror=fail;
    a.onended=()=>{if(token!==playToken)return;resetVisioToListening();onend?.();resolve(a)};
    try{
      video.currentTime=0;a.currentTime=0;
      video.muted=true;
      Promise.allSettled([video.play(),a.play()]).then(results=>{if(results[1].status==='rejected')fail()});
    }catch{fail()}
  });
}
async function playLucas(key,onend){
  const token=++playToken;
  if(audio){audio.pause();audio=null}
  choices.classList.remove('show');listening.classList.remove('show');
  if(key==='opening'){await playOpeningNative(onend,token);return}
  // Rejected V4 is excluded. Use only the previously less synthetic candidates.
  const versions=key==='warm'?['v3','v2']:['v2'];
  for(const version of versions){
    if(token!==playToken)return;
    const result=await startPair(key,version,onend,token);
    if(result)return;
  }
  if(token!==playToken)return;
  resetVisioToListening();listening.textContent='Audio Lucas en préparation…';onend?.();
}
function enter(key){if(key==='finish'){finish();return}const s=scenes[key];if(!s)return;playLucas(s.audio,()=>showChoices(s.choices))}
function select(next){choices.classList.remove('show');listening.classList.remove('show');setTimeout(()=>enter(next),220)}
function finish(){playToken++;if(audio){audio.pause();audio=null}video.onended=null;video.pause();ended.classList.add('show')}
function begin(){ended.classList.remove('show');startgate.style.display='none';video.loop=false;video.src=BASE_VISIO;video.load();video.muted=true;try{video.currentTime=0}catch{}enter('opening')}
function restart(){begin()}
document.getElementById('startCall').onclick=begin;document.getElementById('end').onclick=finish;document.getElementById('restart').onclick=restart;document.getElementById('camera').onclick=e=>{const self=document.getElementById('selfView');self.style.display=self.style.display==='none'?'grid':'none';e.currentTarget.classList.toggle('off')};document.getElementById('mic').onclick=e=>e.currentTarget.classList.toggle('off');
video.muted=true;video.loop=false;video.src=BASE_VISIO;video.load();
</script>
</body>
</html>
