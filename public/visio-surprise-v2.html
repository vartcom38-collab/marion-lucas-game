<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>MonIA · Lucas visio handheld V3</title>
<style>
html,body{margin:0;height:100%;background:#080706;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;overflow:hidden}.phone{position:relative;width:min(100vw,460px);height:min(100vh,820px);aspect-ratio:9/16;background:#111;border-radius:30px;overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.48)}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#090807;transition:opacity .18s ease}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.34),transparent 22%,transparent 72%,rgba(0,0,0,.5))}.top{position:absolute;top:0;left:0;right:0;padding:24px 22px 18px;display:flex;align-items:center;justify-content:space-between;z-index:3}.who{display:grid;gap:2px}.who strong{font-size:18px}.who span{font-size:12px;color:rgba(255,255,255,.7)}.badge{padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);font-size:11px;font-weight:700;letter-spacing:.02em}.bottom{position:absolute;left:0;right:0;bottom:0;padding:22px;z-index:3;display:grid;gap:14px}.hint{text-align:center;font-size:12px;color:rgba(255,255,255,.72);text-shadow:0 1px 8px rgba(0,0,0,.7)}button{justify-self:center;border:0;border-radius:999px;padding:12px 18px;background:rgba(255,255,255,.92);color:#16120f;font-weight:750;font-size:14px;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.24)}button:disabled{opacity:.55;cursor:default}@media(max-width:520px){.phone{width:100vw;height:100vh;border-radius:0}}
</style>
</head>
<body>
<div class="phone">
  <video id="v" playsinline muted autoplay loop></video>
  <div class="shade"></div>
  <div class="top"><div class="who"><strong>Lucas</strong><span>Appel vidéo · MonIA handheld V3</span></div><div class="badge" id="badge">● Lucas écoute</div></div>
  <div class="bottom"><div class="hint" id="hint">Lucas tient son téléphone · candidat non validé</div><button id="go">Tester la réponse</button></div>
</div>
<script>
const base='/resources/monia/generated/';
const media={
 listen:base+'visio-lucas-surprise-v3-handheld-listening-candidate.mp4',
 talk:base+'visio-lucas-surprise-v3-handheld-speaking-v4voice-candidate.mp4',
 reaction:base+'visio-lucas-surprise-v3-handheld-reaction-candidate.mp4'
};
const v=document.getElementById('v'),badge=document.getElementById('badge'),go=document.getElementById('go'),hint=document.getElementById('hint');
let running=false;
async function setState(state,loop=true){
  const labels={listen:'● Lucas écoute',talk:'● Lucas parle',reaction:'● Lucas réagit'};
  badge.textContent=labels[state];v.loop=loop;v.muted=state!=='talk';v.src=media[state];v.load();
  try{await v.play()}catch{}
}
async function cycle(){if(running)return;running=true;go.disabled=true;hint.textContent='Marion parle…';await setState('listen',true);await new Promise(r=>setTimeout(r,1900));hint.textContent='Lucas répond avec la voix V4';await setState('talk',false);await new Promise(resolve=>{const done=()=>{v.removeEventListener('ended',done);resolve()};v.addEventListener('ended',done);setTimeout(done,10000)});hint.textContent='Lucas attend ta réaction…';await setState('reaction',false);await new Promise(resolve=>{const done=()=>{v.removeEventListener('ended',done);resolve()};v.addEventListener('ended',done);setTimeout(done,5000)});hint.textContent='Lucas tient son téléphone · candidat non validé';await setState('listen',true);go.disabled=false;running=false}
go.addEventListener('click',cycle);setState('listen',true);
</script>
</body>
</html>
